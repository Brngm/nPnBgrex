<script> // FOCUS CHILD PANEL RUNTIME
(function () {
    const FOCUS_PARENT = window.opener;

    const state = {
        active: true,
        id: -1,
        validNode: false
    };

    function getBasicNodeSearchData() {
        if (
            !FOCUS_PARENT ||
            FOCUS_PARENT.closed ||
            typeof FOCUS_PARENT.FOCUS_entity_by_BN_BasicNodeSearchData !== "function"
        ) {
            return [];
        }

        return FOCUS_PARENT.FOCUS_entity_by_BN_BasicNodeSearchData();
    }

    function getFocusInput() {
        return document.querySelector(".FOCUSinput");
    }

    function getFocusInputCom() {
        return document.querySelector(".FOCUSinput_COM");
    }

    function getFocusSuggestions() {
        return document.querySelector(".FOCUS-suggestions");
    }

    function getFocusResult() {
        return document.querySelector(".FOCUSresult");
    }


    function getFocusSearchItems() {
        if (
            !FOCUS_PARENT ||
            FOCUS_PARENT.closed ||
            typeof FOCUS_PARENT.BasicNodeReferenceBuildItems !== "function"
        ) {
            return [];
        }

        return FOCUS_PARENT.BasicNodeReferenceBuildItems(
            getBasicNodeSearchData(),
            { idField: "id", labelField: "label", internalIdField: "id" }
        );
    }

    function FOCUSsearchNormalize(value) {
        return FOCUS_PARENT.BasicNodeReferenceNormalize(value);
    }

    // Unified BasicNode reference search: query may match idGBASE:label or label.

    function FOCUSinputStrOK(str) {
        const q = FOCUSsearchNormalize(str);
        if (q === "") {
            return [false, -1, "BasicNode reference missing"];
        }

        const items = getFocusSearchItems();

        const exact = FOCUS_PARENT.BasicNodeReferenceFindExact(items, q);

        if (exact) {
            return [true, exact.id, exact.display];
        }

        const candidates = FOCUS_PARENT.BasicNodeReferenceFindMatches(items, q);

        if (candidates.length === 0) {
            return [false, -1, "BasicNode reference missing"];
        }

        if (candidates.length > 1) {
            const candidatesStr = candidates
                .slice(0, 20)
                .map(item => item.display)
                .join(", ");

            return [
                false,
                -1,
                "several BasicNodes: " + candidatesStr + (candidates.length > 20 ? ", ..." : "")
            ];
        }

        return [true, candidates[0].id, candidates[0].display];
    }

    function UPDATE_FOCUSresult(myid) {
        const result = getFocusResult();

        if (myid === -1) {
            result.innerHTML = "";
            return;
        }

        result.innerHTML = "";
    }

    function CLICK_FOCUSinputStr(e) {
        if (e.key !== "Enter") {
            return;
        }

        const input = getFocusInput();
        const inputCom = getFocusInputCom();
        const suggestions = getFocusSuggestions();

        const str = input.value.trim();

        if (str === "") {
            inputCom.textContent = "Please enter a BasicNode reference.";

            state.validNode = false;
            state.id = -1;

            UPDATE_FOCUSresult(-1);
            UPDATE_FOCUS_VISIBILITY_predictions();
            return;
        }

        const X = FOCUSinputStrOK(str);

        if (X[0]) {
            state.validNode = true;
            state.id = X[1];

            if (
                FOCUS_PARENT &&
                !FOCUS_PARENT.closed &&
                typeof FOCUS_PARENT.FOCUS_entity_by_BN_COM_String === "function"
            ) {
                inputCom.textContent = FOCUS_PARENT.FOCUS_entity_by_BN_COM_String(X[1]);
            }
            else {
                inputCom.textContent = X[2];
            }

            if (
                FOCUS_PARENT &&
                !FOCUS_PARENT.closed &&
                FOCUS_PARENT.STATE_FOCUS_entity_by_BN
            ) {
                FOCUS_PARENT.STATE_FOCUS_entity_by_BN.active = true;
                FOCUS_PARENT.STATE_FOCUS_entity_by_BN.validNode = true;
                FOCUS_PARENT.STATE_FOCUS_entity_by_BN.id = X[1];
            }

            UPDATE_FOCUSresult(X[1]);
            UPDATE_FOCUS_VISIBILITY_predictions();
        }
        else {
            state.validNode = false;
            state.id = -1;

            if (
                FOCUS_PARENT &&
                !FOCUS_PARENT.closed &&
                FOCUS_PARENT.STATE_FOCUS_entity_by_BN
            ) {
                FOCUS_PARENT.STATE_FOCUS_entity_by_BN.validNode = false;
                FOCUS_PARENT.STATE_FOCUS_entity_by_BN.id = -1;
            }

            inputCom.textContent = X[2];

            UPDATE_FOCUSresult(-1);
            UPDATE_FOCUS_VISIBILITY_predictions();
        }

        suggestions.style.display = "none";
    }

    function UPDATE_FOCUSsuggestions() {
        const input = getFocusInput();
        const suggestions = getFocusSuggestions();

        const q = FOCUSsearchNormalize(input.value);

        if (q === "") {
            suggestions.style.display = "none";
            return;
        }

        const matches = FOCUS_PARENT.BasicNodeReferenceFindMatches(getFocusSearchItems(), q)
            .slice(0, 1000);

        suggestions.innerHTML = "";

        if (matches.length === 0) {
            suggestions.style.display = "none";
            return;
        }

        matches.forEach(node => {
            const item = document.createElement("div");

            item.className = "FOCUS-suggestion-item";
            item.textContent = node.display;

            item.addEventListener("mousedown", event => {
                event.preventDefault();
                event.stopPropagation();

                input.value = node.display;
                suggestions.style.display = "none";

                CLICK_FOCUSinputStr({ key: "Enter" });
            });

            suggestions.appendChild(item);
        });

        suggestions.style.display = "block";
    }

    function CLICK_FOCUS_GO() {
        const inputCom = getFocusInputCom();

        if (!state.validNode) {
            inputCom.textContent = "Please enter a valid BasicNode reference.";
            return;
        }

        if (
            !FOCUS_PARENT ||
            FOCUS_PARENT.closed ||
            typeof FOCUS_PARENT.ZOOM_ENTITY_from_BasicNode !== "function"
        ) {
            inputCom.textContent = "FOCUS parent missing.";
            return;
        }

        const ok = FOCUS_PARENT.ZOOM_ENTITY_from_BasicNode(state.id);

        if (ok === "BUSY") {
            inputCom.textContent = "Visualization not ready.";
            return;
        }

        if (!ok) {
            inputCom.textContent = "Entity missing.";
            return;
        }

        if (typeof FOCUS_PARENT.FOCUS_entity_by_BN_COM_String === "function") {
            inputCom.textContent = FOCUS_PARENT.FOCUS_entity_by_BN_COM_String(state.id);
        }
    }


    function UPDATE_FOCUS_VISIBILITY_predictions() {
        document
            .querySelectorAll('.FOCUS_VIS_sharedPanel[data-vis-code="VIS.BN.1.E"] .action-blocVizFromNode')
            .forEach(block => {
                const message = block.querySelector(".FOCUSvisPredictionCOM");
                const buttons = block.querySelectorAll(".FOCUSvisButton");

                buttons.forEach(button => {
                    const desc = button.parentElement.querySelector(".desc-textVizFromNode");
                    if (desc) desc.textContent = "";
                });

                if (!state.validNode) {
                    if (message) {
                        message.textContent = "Confirm BasicNode in the search field.";
                    }
                    return;
                }

                if (
                    !FOCUS_PARENT ||
                    FOCUS_PARENT.closed ||
                    typeof FOCUS_PARENT.FOCUS_entity_by_BN_visibilityPrediction !== "function"
                ) {
                    if (message) {
                        message.textContent = "FOCUS parent missing.";
                    }
                    return;
                }

                if (message) {
                    message.textContent = "";
                }

                buttons.forEach(button => {
                    const desc = button.parentElement.querySelector(".desc-textVizFromNode");
                    const result = FOCUS_PARENT.FOCUS_entity_by_BN_visibilityPrediction(
                        state.id,
                        button.dataset.kind,
                        button.dataset.aro
                    );

                    if (!desc) return;

                    if (!result || result.ok === false || result.ok === "BUSY") {
                        desc.textContent = "";
                        if (message) {
                            message.textContent =
                                result && result.message
                                    ? result.message
                                    : "Visibility prediction failed.";
                        }
                        return;
                    }

                    desc.textContent = result.text || "";
                });
            });
    }

    function CLICK_FOCUS_VISIBILITY(kind, ARO) {
        const inputCom = getFocusInputCom();

        if (!state.validNode) {
            inputCom.textContent = "Please enter a valid BasicNode reference.";
            return;
        }

        if (
            !FOCUS_PARENT ||
            FOCUS_PARENT.closed ||
            typeof FOCUS_PARENT.UPDATE_ENTITY_VISIBILITY_from_BasicNode !== "function"
        ) {
            inputCom.textContent = "FOCUS parent missing.";
            return;
        }

        const ok = FOCUS_PARENT.UPDATE_ENTITY_VISIBILITY_from_BasicNode(state.id, kind, ARO);

        if (ok === "BUSY") {
            inputCom.textContent = "Visualization not ready.";
            return;
        }

        if (!ok) {
            inputCom.textContent = "Visibility update failed.";
            return;
        }

        if (typeof FOCUS_PARENT.FOCUS_entity_by_BN_COM_String === "function") {
            inputCom.textContent = FOCUS_PARENT.FOCUS_entity_by_BN_COM_String(state.id);
        }

        UPDATE_FOCUS_VISIBILITY_predictions();
    }


    function bringFOCUSPanelToFront(panel) {
        document.querySelectorAll(".FOCUSpanel").forEach(p => {
            p.style.zIndex = "10";
        });
        panel.style.zIndex = "100";
    }

    function makeFOCUSPanelDraggable(panel) {
        const header = panel.querySelector(".FOCUSpanel-title");
        if (!header) return;

        let dragging = false;
        let offsetX = 0;
        let offsetY = 0;

        header.addEventListener("mousedown", event => {
            if (event.target.closest(".FOCUSpanel-iconify")) return;

            dragging = true;
            bringFOCUSPanelToFront(panel);

            const rect = panel.getBoundingClientRect();
            offsetX = event.clientX - rect.left;
            offsetY = event.clientY - rect.top;

            event.preventDefault();
        });

        document.addEventListener("mousemove", event => {
            if (!dragging) return;

            const parent = panel.closest(".FOCUSdockArea") || panel.parentElement || document.body;
            const parentRect = parent.getBoundingClientRect();

            let x = event.clientX - parentRect.left - offsetX;
            let y = event.clientY - parentRect.top - offsetY;

            const maxX = Math.max(0, parent.clientWidth - panel.offsetWidth);
            const maxY = Math.max(0, parent.clientHeight - panel.offsetHeight);

            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));

            panel.style.left = x + "px";
            panel.style.top = y + "px";
        });

    <script> // GENTITY COLORS, MATERIALS AND 3D OBJECT HELPERS
        // Graph visibility modification helpers.
        function getGraphNodeId(x) {
            return (x && typeof x === "object") ? x.id : x;
        }

        function getColorGroupForNode(node) {
            if (!node) return [0];

            if (node.group && node.group[STATE_GENTITY_si.s]) {
                if (ScaleFrozenColor_ENTITY_Si > -1 && node.group[ScaleFrozenColor_ENTITY_Si]) {
                    return node.group[ScaleFrozenColor_ENTITY_Si];
                }
                return node.group[STATE_GENTITY_si.s];
            }

            if (node.Id_Entity !== undefined) {
                return [node.Id_Entity];
            }

            return [node.id || 0];
        }

        function myColorNode(id) {
            if (!GENTITY_si.nodes[id].HILITE) {
                let group = getColorGroupForNode(GENTITY_si.nodes[id]);
                return myColorNodeP(group);
            }
            else {
                return [255, 255, 255];
            }
        };

        function myColorNode_forLinks(id) {
            let group = getColorGroupForNode(GENTITY_si.nodes[id]);
            return myColorNodeP(group);
        };

        function myColorNodeP(group) {
            const x = PREF.NODE.ColorCoef;
            const color = colorRGB[group[0] % colorRGB.length];
            return [color[0] * x, color[1] * x, color[2] * x];
        };

        function myColorLink(link) {
            const s = getGraphNodeId(link.source);
            const t = getGraphNodeId(link.target);

            if (hoverNode_ENTITY_Si) {
                if ((s === hoverNode_ENTITY_Si.id) || (t === hoverNode_ENTITY_Si.id)) {
                    return [255, 255, 255];
                }
            }

            const c1 = myColorNode_forLinks(s);
            const c2 = myColorNode_forLinks(t);
            const x = PREF.LINK.ColorCoef;

            return averageColor_rgba(
                [c1[0] * x, c1[1] * x, c1[2] * x],
                [c2[0] * x, c2[1] * x, c2[2] * x]
            );
        };


        function shuffle(X) {
                    for (let i = X.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [X[i], X[j]] = [X[j], X[i]];
            }
            return X;
        }


        function averageColor_rgba(c1, c2) {
            return "rgba(" +
                (c1[0] + c2[0]) / 2.0 + "," +
                (c1[1] + c2[1]) / 2.0 + "," +
                (c1[2] + c2[2]) / 2.0 + "," +
                PREF.LINK.ColorTrans +
                ")";
        }

        function colorRGB_2_Threejs(rgb) {
            const [r, g, b] = rgb;
            return (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b);
        }

        function init_nodeThreeObject() {
            Graph_ENTITY_Si.nodeThreeObject(node => {
                const object3D = new THREE.Mesh(
                    GREEX_SHARED.nodeGeometry(CTX_GENTITY_si, node, PREF, THREE),

                    new THREE.MeshLambertMaterial({
                        color: colorRGB_2_Threejs(myColorNode(node.id)),
                        transparent: PREF.NODE.ColorTrans,
                        opacity: PREF.NODE.ColorOpac
                    })
                );

                // Object reference consumed by refresh routines.
                node.__sphere = object3D;

                if (LABEL_state(node) > 0) {
                    LABEL_createFixed(CTX_GENTITY_si, node);
                }

                return object3D;
            });
        }

        function FreezeGraph(ctx = CTX_GENTITY_si) {
            ctx.Graph.graphData().nodes.forEach(n => {
                n.fx = n.x;
                n.fy = n.y;
                n.fz = n.z;
            });
        }

        function UnFreezeGraph(ctx = CTX_GENTITY_si) {
            ctx.Graph.graphData().nodes.forEach(n => {
                n.fx = undefined;
                n.fy = undefined;
                n.fz = undefined;
            });
        }

        // Simulation freeze gate used by onGraphEngineStop() and PLOT_Vastur(CTX_GENTITY_si).
        let freezeAfterSimulation = false;

        function onGraphEngineStop() {

            if (!freezeAfterSimulation) {
                return;
            }

            freezeAfterSimulation = false;

            Graph_ENTITY_Si.graphData().nodes.forEach(n => {
                n.fx = n.x;
                n.fy = n.y;
                n.fz = n.z;
            });

            Graph_ENTITY_Si.onEngineStop(() => { });

        }


        function RefreshGraphObjectsDirect(ctx = CTX_GENTITY_si) {
            RefreshNodeColors(ctx);
            RefreshNodeVisibility(ctx);
            RefreshLabelVisibility(ctx);
            RefreshLinkVisibility(ctx);
        }

        function RefreshNodeColors(ctx = CTX_GENTITY_si) {
            const graph = ctxGraph(ctx);
            const vertices = graph.graphData().nodes;

            vertices.forEach(node => {
                if (!node.__sphere || !node.__sphere.material) return;

                node.__sphere.material.color.set(
                    colorRGB_2_Threejs(myColorNode(node.id))
                );

                node.__sphere.material.transparent = PREF.NODE.ColorTrans;
                node.__sphere.material.opacity = PREF.NODE.ColorOpac;
                node.__sphere.material.needsUpdate = true;
            });

            graph.linkColor(link => myColorLink(link));
        }


        // Full synchronization after a visibility state change.
        // Do not call this when merely opening a menu/popup: no graph state changed.


        // Single commit for ADD/REM/ONL visibility actions.

        //   1) prepare/predict without mutation or refresh;
        //   2) mutate data and history silently;
        //   3) synchronize once with RefreshVisibility(ctx).
        // Visibility changes must not restart the layout.

        function makeJson_BasicNodes(ctx = CTX_GENTITY_si) {
            const id_s = ctx.STATE.s;
            const visibleEntityIds = new Set();

            ctx.Gjson.nodes.forEach(entity => {
                if (entity.visible) {
                    visibleEntityIds.add(entity.Id_Entity);
                }
            });

            const Basic2Node = new Map();
            const nodes = [];

            for (let i = 0; i < GBASE.nodes.length; i++) {
                const basic = GBASE.nodes[i];
                const idEntity = basic.group[id_s][0];

                if (!visibleEntityIds.has(idEntity)) continue;

                Basic2Node.set(basic.id, nodes.length);

                const entityNodeId =
                    ctx.Entity2Node && typeof ctx.Entity2Node.get === "function"
                        ? ctx.Entity2Node.get(idEntity)
                        : (ctx.Gjson && ctx.Gjson.Entity2Node && typeof ctx.Gjson.Entity2Node.get === "function"
                            ? ctx.Gjson.Entity2Node.get(idEntity)
                            : undefined);

                const entityLabel =
                    entityNodeId !== undefined && entityNodeId !== null &&
                    ctx.Gjson && ctx.Gjson.nodes && ctx.Gjson.nodes[entityNodeId]
                        ? ctx.Gjson.nodes[entityNodeId].name
                        : "?";

                nodes.push({
                    id: nodes.length,
                    Id_BasicNode: basic.id,
                    Id_Entity: idEntity,
                    Id_EntityNode: entityNodeId,
                    entityLabelDisplay: entityLabel,
                    name: myIdLabelStringGBASE(basic.id),
                    labelDisplay: BasicNodeDisplayLabelString(basic.id),
                    group: basic.group
                });
            }

            const links = [];

            for (let i = 0; i < GBASE.links.length; i++) {
                const link = GBASE.links[i];

                const sourceBasicId = graphEndpointId(link.source);
                const targetBasicId = graphEndpointId(link.target);

                const source = Basic2Node.get(sourceBasicId);
                const target = Basic2Node.get(targetBasicId);

                if (source === undefined || target === undefined) continue;

                links.push({
                    id: links.length,
                    source: source,
                    target: target,
                    Id_BasicLink: link.id,
                    value: 1
                });
            }

            return {
                name: myNameStringGBASE() + " — BasicNodes covered by visible Entities",
                s: id_s,
                meta: {
                    vertexType: "BASICNODE",
                    source: "GBASE",
                    kind: "SubGraph_BasicNodes_Covered_By_Visible_Entities"
                },
                nodes: nodes,
                links: links,
                Basic2Node: Basic2Node
            };

        function getSubGraphBN_Geometry() {
            const reference = getGraphWindowGeometry();

            // Child window opening geometry.
            // Adjustable parameter:
            // - openScale controls child window size relative to the mother window.
            // - left/top center the child window on the mother window when supported by the browser/OS.
            // Internal graph dimensions remain reference.graphWidth/reference.graphHeight.
            const openScale = 0.72;
            const width = Math.round(reference.width * openScale);
            const height = Math.round(reference.height * openScale);
            const parentLeft = Math.round(window.screenX || window.screenLeft || 0);
            const parentTop = Math.round(window.screenY || window.screenTop || 0);
            const parentWidth = Math.round(window.outerWidth || window.innerWidth);
            const parentHeight = Math.round(window.outerHeight || window.innerHeight);
            const maxLeft = Math.max(0, window.screen.availWidth - width);
            const maxTop = Math.max(0, window.screen.availHeight - height);
            const left = Math.min(Math.max(0, parentLeft + Math.round((parentWidth - width) / 2)), maxLeft);
            const top = Math.min(Math.max(0, parentTop + Math.round((parentHeight - height) / 2)), maxTop);

            return {
                width,
                height,
                left,
                top,

    <script> // GBASIC CHILD WINDOW RUNTIME
        const G = ${JSON.stringify(graphData)};
        const graphName = ${JSON.stringify(graphName)};
        const nbVertices = ${JSON.stringify(nbVertices)};
        const nbEdges = ${JSON.stringify(nbEdges)};
        const scalesData = ${JSON.stringify(scalesData)};
        const colorRGB = ${JSON.stringify(colorRGBData)};
        const graphBackgroundColor = ${JSON.stringify(graphBackgroundColor)};
        const PREF = {
            NODE: ${JSON.stringify(prefNode)},
            LABEL: ${JSON.stringify(PREF.LABEL)},
            BACKGROUND: { backgroundColor: graphBackgroundColor },
            LINK: {
                ColorCoef: ${JSON.stringify(prefLinkColorCoef)},
                ColorTrans: ${JSON.stringify(prefLinkOpacity)},
                Width: 1
            }
        };
        const prefNodeColorCoef = ${JSON.stringify(prefNodeColorCoef)};
        let prefLinkColorCoef = PREF.LINK.ColorCoef;
        let prefLinkOpacity = PREF.LINK.ColorTrans;

        const STATE = {
            s: ${JSON.stringify(activeScaleId)},
            p: ${JSON.stringify(activeScoreP)},
            CLick_node_L_01: true,
            NODE_DRAG: false,
            CAMERA: {
                LOOKAT: { x: 0, y: 0, z: 0 }
            },
            CAMERA0: {
                POSITION: { x: 0, y: 0, z: 0 },
                LOOKAT: { x: 0, y: 0, z: 0 }
            },
            R: {
                active: false,
                speed: 2000,
                timer: null,
                dist: null
            },
            PLOT: {
                stable: false,
                layoutRunId: 0,
                aware: false,
                coef_weak_strength: 10,
                ScaleFrozenColor: -1
            }
        };

        let lastCLick_ground_L_00 = 0;

        let CTX_GBASIC = {
            type: "BASICNODE",
            Graph: null,
            Gjson: G,
            STATE: STATE,
            scheduler: window
        };

        function LABEL_ensure(ctx) {
            if (!ctx.LABEL) ctx.LABEL = {};
            if (!ctx.LABEL.fixedSprites) ctx.LABEL.fixedSprites = new Map();
            return ctx.LABEL;
        }

        function LABEL_nodeId(ctx, node) {
            const label = LABEL_ensure(ctx);
            return typeof label.getNodeId === "function" ? label.getNodeId(node) : node.id;
        }

        function LABEL_text(ctx, node) {
            const label = LABEL_ensure(ctx);
            return typeof label.getLabelText === "function" ? label.getLabelText(node) : String(node.id);
        }

        function LABEL_visible(ctx, node) {
            const label = LABEL_ensure(ctx);
            return typeof label.isVisible === "function" ? label.isVisible(node) : node.visible !== false;
        }

        function LABEL_size(ctx, node) {
            const label = LABEL_ensure(ctx);
            return typeof label.getLabelSize === "function" ? label.getLabelSize(node) : ${PREF.LABEL.sizeFixed};
        }

        function LABEL_graphObject(ctx, node) {
            const label = LABEL_ensure(ctx);
            if (typeof label.getGraphObject === "function") return label.getGraphObject(node);
            return node.__sphere || null;
        }

        function LABEL_state(node) {
            const state = Number(node && node.LabelState);
            return (state === 1 || state === 2) ? state : 0;
        }

        function LABEL_setState(ctx, node, state) {
            if (!node) return;
            const normalized = ((Number(state) || 0) % 3 + 3) % 3;
            node.LabelState = normalized;
            if (normalized === 0) {
                LABEL_removeFixed(ctx, node);
            }
            else {
                LABEL_createFixed(ctx, node);
            }
        }

        function LABEL_applySpriteStyle(ctx, node, sprite) {
            sprite.visible = LABEL_visible(ctx, node) && LABEL_state(node) > 0;
            sprite.color = "black";
            sprite.backgroundColor = "rgba(255,255,255,0)";
            sprite.textHeight = LABEL_size(ctx, node);
        }

        function LABEL_fixedSpriteText(ctx, node) {
            const nbsp = "\u00A0";
            return nbsp + LABEL_text(ctx, node) + nbsp;
        }

        function LABEL_createFixed(ctx, node) {
            if (!node) return null;
            const label = LABEL_ensure(ctx);
            const id = LABEL_nodeId(ctx, node);
            const text = LABEL_fixedSpriteText(ctx, node);
            let sprite = label.fixedSprites.get(id);

            if (sprite && sprite.text !== text) {
                LABEL_removeFixed(ctx, id, false);
                sprite = null;
            }

            if (!sprite) {
                sprite = new SpriteText(text);
                sprite.onBeforeRender = (renderer) => renderer.clearDepth();
                sprite.material.depthWrite = false;
                sprite.material.depthTest = false;
                sprite.material.transparent = true;
                sprite.material.needsUpdate = true;
                sprite.renderOrder = 9999;
                sprite.textAlign = "left";
                sprite.center.set(0, 0);
                sprite.position.x = 0;
                sprite.raycast = () => {};

                const object3D = LABEL_graphObject(ctx, node);
                if (object3D) {
                    object3D.add(sprite);
                    sprite.position.set(0, 0, 0);
                    sprite.position.x = 0;
                }
                label.fixedSprites.set(id, sprite);
            }

            const object3D = LABEL_graphObject(ctx, node);
            if (object3D && sprite.parent !== object3D) {
                if (sprite.parent) sprite.parent.remove(sprite);
                object3D.add(sprite);
                sprite.position.set(0, 0, 0);
                sprite.position.x = 0;
            }

            LABEL_applySpriteStyle(ctx, node, sprite);
            return sprite;
        }

        function LABEL_disposeTexture(texture) {
            if (!texture) return;
            const image = texture.image;
            if (typeof texture.dispose === "function") texture.dispose();
            if (image && typeof image === "object") {
                if (typeof image.close === "function") {
                    try { image.close(); } catch (e) {}
                }
                if (typeof image.width === "number") image.width = 0;
                if (typeof image.height === "number") image.height = 0;
            }
            texture.image = null;
        }

        function LABEL_disposeMaterial(material) {
            if (!material) return;
            const materials = Array.isArray(material) ? material : [material];
            materials.forEach(mat => {
                if (!mat) return;
                [
                    "map", "alphaMap", "aoMap", "bumpMap", "displacementMap",
                    "emissiveMap", "envMap", "lightMap", "metalnessMap",
                    "normalMap", "roughnessMap", "specularMap", "gradientMap"
                ].forEach(key => {
                    LABEL_disposeTexture(mat[key]);
                    mat[key] = null;
                });
                if (typeof mat.dispose === "function") mat.dispose();
            });
        }

        function LABEL_disposeObject3D(object3D) {
            if (!object3D) return;
            object3D.traverse(obj => {
                if (obj.geometry && typeof obj.geometry.dispose === "function") obj.geometry.dispose();
                LABEL_disposeMaterial(obj.material);
                LABEL_disposeTexture(obj.texture);
                obj.texture = null;
                obj.onBeforeRender = null;
                obj.raycast = () => {};
            });
            object3D.clear();
        }

        function LABEL_disposeRendererLists(ctx) {
            const label = LABEL_ensure(ctx);
            const graph = typeof label.getGraph === "function" ? label.getGraph() : (ctx && ctx.Graph ? ctx.Graph : null);
            const renderer = graph && typeof graph.renderer === "function" ? graph.renderer() : null;
            if (renderer && renderer.renderLists && typeof renderer.renderLists.dispose === "function") {
                renderer.renderLists.dispose();
            }
        }

        function LABEL_afterFixedRemovalCleanup(ctx) {
            LABEL_disposeRendererLists(ctx);
            // Run again after rendering so Three.js/WebGL can release stale render-list references.
            const cleanup = () => LABEL_disposeRendererLists(ctx);
            if (typeof requestAnimationFrame === "function") {
                requestAnimationFrame(() => requestAnimationFrame(cleanup));
            }
            setTimeout(cleanup, 250);
        }

        function LABEL_removeFixed(ctx, nodeOrId, cleanupAfter = true) {
            const label = LABEL_ensure(ctx);
            const id = (typeof nodeOrId === "object") ? LABEL_nodeId(ctx, nodeOrId) : nodeOrId;
            const sprite = label.fixedSprites.get(id);
            if (!sprite) return;
            if (sprite.parent) sprite.parent.remove(sprite);
            label.fixedSprites.delete(id);
            LABEL_disposeObject3D(sprite);
            if (cleanupAfter) LABEL_afterFixedRemovalCleanup(ctx);
        }

        function LABEL_cycleState(ctx, node) {
            if (!node) return;
            LABEL_setState(ctx, node, LABEL_state(node) + 1);
        }

        function LABEL_refreshFixed(ctx) {
            const label = LABEL_ensure(ctx);
            Array.from(label.fixedSprites.keys()).forEach(id => {
                const node = typeof label.getNodeById === "function" ? label.getNodeById(id) : null;
                if (!node || LABEL_state(node) === 0) {
                    LABEL_removeFixed(ctx, id);
                }
            });

            if (typeof label.getNodes === "function") {
                label.getNodes().forEach(node => {
                    if (LABEL_state(node) > 0) LABEL_createFixed(ctx, node);
                });
            }
        }

        function LABEL_clearFixed(ctx) {
            const label = LABEL_ensure(ctx);
            Array.from(label.fixedSprites.keys()).forEach(id => LABEL_removeFixed(ctx, id, false));
            LABEL_afterFixedRemovalCleanup(ctx);
            if (typeof label.getNodes === "function") {
                label.getNodes().forEach(node => { node.LabelState = 0; });
            }
        }

        function LABEL_escape(ctx, value) {
            const label = LABEL_ensure(ctx);
            const s = String(value == null ? "" : value);
            if (typeof label.escapeHTML === "function") return label.escapeHTML(s);
            return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function LABEL_graphElement(ctx) {
            const label = LABEL_ensure(ctx);
            if (typeof label.getGraphElement === "function") return label.getGraphElement();
            return document.getElementById("Graph3D");
        }

        function LABEL_hoverContainer(ctx) {
            const label = LABEL_ensure(ctx);
            if (label.hoverContainer) return label.hoverContainer;

            const graphEl = LABEL_graphElement(ctx);
            if (!graphEl) return null;

            if (getComputedStyle(graphEl).position === "static") {
                graphEl.style.position = "relative";
            }

            const container = document.createElement("div");
            container.className = "MIAP-hover-label-container";
            container.style.position = "absolute";
            container.style.left = "0";
            container.style.top = "0";
            container.style.width = "100%";
            container.style.height = "100%";
            container.style.pointerEvents = "none";
            container.style.overflow = "hidden";
            container.style.zIndex = "20";
            graphEl.appendChild(container);
            label.hoverContainer = container;
            return container;
        }

        function LABEL_neighborNodes(ctx, node) {
            const label = LABEL_ensure(ctx);
            if (typeof label.getNeighborNodes === "function") return label.getNeighborNodes(node);
            if (!node || !Array.isArray(node.neighbors) || typeof label.getNodeById !== "function") return [];
            return node.neighbors.map(id => label.getNodeById(id)).filter(Boolean);
        }

        function LABEL_projectToGraph(ctx, node) {
            const graph = ctx && ctx.Graph;
            const graphEl = LABEL_graphElement(ctx);
            if (!graph || !graphEl || typeof graph.camera !== "function" || !node) return null;

            const camera = graph.camera();
            if (!camera) return null;

            const rect = graphEl.getBoundingClientRect();
            const width = rect.width || graphEl.clientWidth || 1;
            const height = rect.height || graphEl.clientHeight || 1;
            const vector = new THREE.Vector3(node.x || 0, node.y || 0, node.z || 0).project(camera);
            if (!Number.isFinite(vector.x) || !Number.isFinite(vector.y) || !Number.isFinite(vector.z)) return null;
            if (vector.z < -1 || vector.z > 1) return null;

            return {
                x: (vector.x + 1) / 2 * width,
                y: (-vector.y + 1) / 2 * height
            };
        }

        function LABEL_makeHoverElement(ctx, node, cause) {
            const label = LABEL_ensure(ctx);
            const element = document.createElement("div");
            element.className = "MIAP-hover-label MIAP-hover-label-" + cause;
            element.innerHTML = LABEL_escape(ctx, LABEL_text(ctx, node));
            element.style.position = "absolute";
            element.style.left = "0";
            element.style.top = "0";
            element.style.transform = "translate(0, -100%)";
            element.style.fontSize = "${PREF.LABEL.sizeHover}px";
            element.style.fontWeight = "bold";
            element.style.color = "black";
            element.style.backgroundColor = "rgba(255,255,255,0.75)";
            element.style.padding = "2px 4px";
            element.style.borderRadius = "4px";
            element.style.whiteSpace = "nowrap";
            element.style.pointerEvents = "none";
            element.style.willChange = "transform";
            label.hoverEntries.push({ node, element });
            return element;
        }

        function LABEL_renderHoverHtml(ctx) {
            const label = LABEL_ensure(ctx);
            if (!Array.isArray(label.hoverEntries)) return;

            label.hoverEntries.forEach(entry => {
                const pos = LABEL_projectToGraph(ctx, entry.node);
                if (!pos || !LABEL_visible(ctx, entry.node)) {
                    entry.element.style.display = "none";
                    return;
                }
                entry.element.style.display = "block";
                entry.element.style.left = Math.round(pos.x) + "px";
                entry.element.style.top = Math.round(pos.y) + "px";
            });
        }

        function LABEL_startHoverLoop(ctx) {
            const label = LABEL_ensure(ctx);
            if (label.hoverAnimationFrame) return;
            const tick = () => {
                if (!label.hoverEntries || label.hoverEntries.length === 0) {
                    label.hoverAnimationFrame = null;
                    return;
                }
                LABEL_renderHoverHtml(ctx);
                label.hoverAnimationFrame = requestAnimationFrame(tick);
            };
            label.hoverAnimationFrame = requestAnimationFrame(tick);
        }

        function LABEL_clearHoverHtml(ctx) {
            const label = LABEL_ensure(ctx);
            if (label.hoverAnimationFrame) {
                cancelAnimationFrame(label.hoverAnimationFrame);
                label.hoverAnimationFrame = null;
            }
            if (label.hoverContainer) {
                label.hoverContainer.innerHTML = "";
            }
            label.hoverEntries = [];
        }

        function LABEL_showHoverHtml(ctx, hoveredNode) {
            LABEL_clearHoverHtml(ctx);
            if (!hoveredNode || !LABEL_visible(ctx, hoveredNode)) return;

            const label = LABEL_ensure(ctx);
            const container = LABEL_hoverContainer(ctx);
            if (!container) return;

            label.hoverEntries = [];
            container.appendChild(LABEL_makeHoverElement(ctx, hoveredNode, "hovered"));

            const showNeighbors = ctx && ctx.STATE && ctx.STATE.CLick_node_L_01 === true;
            if (showNeighbors) {
                LABEL_neighborNodes(ctx, hoveredNode).forEach(neighbor => {
                    if (neighbor && neighbor !== hoveredNode && LABEL_visible(ctx, neighbor)) {
                        container.appendChild(LABEL_makeHoverElement(ctx, neighbor, "hover-neighbor"));
                    }
                });
            }

            LABEL_renderHoverHtml(ctx);
            LABEL_startHoverLoop(ctx);
        }


        function BasicNodeLabelString_GBASIC(node) {
            if (!node) return "";

            const shared = GREEX_childShared();
            const basicDisplay = node.labelDisplay || shared.basicNodeDisplayLabelString(node.Id_BasicNode);
            const dynamicEntity = shared.entityLabelForBasicNodeAtScale(node.Id_BasicNode, STATE.s);
            const fallbackEntityNodeId = Number(node.Id_EntityNode);
            const entityPrefix = dynamicEntity && dynamicEntity.entityNodeId !== undefined && dynamicEntity.entityNodeId !== null
                ? dynamicEntity.entityNodeId
                : (Number.isFinite(fallbackEntityNodeId) ? fallbackEntityNodeId : "?");
            const entityDisplay = dynamicEntity && dynamicEntity.entityDisplay !== undefined && dynamicEntity.entityDisplay !== null
                ? String(dynamicEntity.entityDisplay)
                : String(node.entityLabelDisplay || "?");
            const scale = scalesData[STATE.s] || {};
            const scaleValue = scale.s != null ? scale.s : STATE.s;

            return basicDisplay + " ∈ " + entityPrefix + ":" + entityDisplay + " at s=" + scaleValue;
        }

        CTX_GBASIC.LABEL = {
            fixedSprites: new Map(),
            getNodes: () => G.nodes,
            getNodeById: id => G.nodes[id],
            getNodeId: node => node.id,
            isVisible: node => isBasicNodeVisible(node),
            getLabelText: node => BasicNodeLabelString_GBASIC(node),
            getLabelSize: node => LABEL_state(node) === 2 ? 2 * PREF.LABEL.sizeFixed : PREF.LABEL.sizeFixed,
            getGraphObject: node => node.__sphere || null,
            getGraphElement: () => document.getElementById("Graph3D"),
            getGraph: () => CTX_GBASIC.Graph,
            getNeighborNodes: node => (node.neighbors || []).map(id => G.nodes[id]).filter(Boolean),
            escapeHTML: value => escapeHTML_GBASIC(value)
        };


        function GREEX_childShared() {
            const openerWindow = window.opener;
            const shared = openerWindow && openerWindow.GREEX_SHARED;
            if (!shared) {
                throw new Error("GREEX_SHARED is unavailable: the BasicNodes window must be opened from the mother window.");
            }
            return shared;
        }

        function initUserGuide_GBASIC() {
            return GREEX_childShared().initUserGuideControl({
                doc: document,
                button: document.getElementById("userguide"),
                href: "../UserGuide.pdf"
            });
        }

        function initExport_GBASIC(ctx) {
            return GREEX_childShared().initExportControl(ctx, {
                doc: document,
                button: document.getElementById("export"),
                menu: document.getElementById("export-menu"),
                graph: ctx ? ctx.Graph : null,
                animateLogo: () => GREEX_childShared().animateColorLogo({
                    doc: document,
                    colorRGB: colorRGB
                }),
                getFileBaseName: () => {
                    const scale = scalesData[STATE.s] || {};
                    return "viz3D.nPnB." + graphName + ".GBASIC." + (STATE.p ? "Cp" : "Co") + "." + (scale.s || STATE.s);
                }
            });
        }


        function rgbToCss_GBASIC(rgb) {
            return GREEX_childShared().rgbToCss(rgb);
        }

        function rgbaToCss_GBASIC(rgb, opacity) {
            return GREEX_childShared().rgbaToCss(rgb, opacity);
        }

        function averageRgb_GBASIC(a, b) {
            return GREEX_childShared().averageRgb(a, b);
        }

        function groupColor(groupId) {
            const base = colorRGB[Math.abs(groupId) % colorRGB.length] || [128, 128, 128];
            return [
                base[0] * prefNodeColorCoef,
                base[1] * prefNodeColorCoef,
                base[2] * prefNodeColorCoef
            ];
        }

        function basicNodeColorScaleIndex() {
            if (
                STATE && STATE.PLOT &&
                Number.isInteger(STATE.PLOT.ScaleFrozenColor) &&
                STATE.PLOT.ScaleFrozenColor >= 0
            ) {
                return STATE.PLOT.ScaleFrozenColor;
            }
            return STATE.s;
        }

        function basicNodeGroupsAtScale(node, id_s = basicNodeColorScaleIndex()) {
            if (!node || !node.group || !node.group[id_s] || node.group[id_s].length === 0) {
                return [0];
            }
            return node.group[id_s];
        }

        function basicNodeBaseColor(node) {
            const groups = basicNodeGroupsAtScale(node);

            if (STATE.p) {
                return groupColor(groups[0]);
            }

            let color = groupColor(groups[0]);
            for (let i = 1; i < groups.length; i++) {
                color = averageRgb_GBASIC(color, groupColor(groups[i]));
            }
            return color;
        }

        function basicNodeColor(node) {
            if (node && node.HILITE) {
                return [255, 255, 255];
            }

            return basicNodeBaseColor(node);
        }

        function basicLinkColor(link) {
            // Highlighted BasicNode links are requested as white.
            if (highlightBasicLinks.has(link)) {
                return [255, 255, 255];
            }

            const source =
                typeof link.source === "object"
                    ? link.source
                    : G.nodes[link.source];

            const target =
                typeof link.target === "object"
                    ? link.target
                    : G.nodes[link.target];

            const color = averageRgb_GBASIC(
                basicNodeBaseColor(source),
                basicNodeBaseColor(target)
            );

            return rgbaToCss_GBASIC(
                [
                    color[0] * prefLinkColorCoef,
                    color[1] * prefLinkColorCoef,
                    color[2] * prefLinkColorCoef
                ],
                prefLinkOpacity
            );
        }

        function refreshScaleButtons_GBASIC() {
            return GREEX_childShared().refreshScaleButtons(null, {
                doc: document,
                selector: "#Scale-buttonS .scale-button",
                isActive: (btn, i) => i === STATE.s
            });
        }

        function animateScores(kind) {
            const scoreP = document.getElementById("scoreP");
            const scoreO = document.getElementById("scoreO");

            scoreP.classList.remove("updated", "glow", "burst");
            scoreO.classList.remove("updated", "glow", "burst");

            const animationClass = (kind === "scale") ? "glow" : "burst";

            scoreP.classList.add("updated", animationClass);
            scoreO.classList.add("updated", animationClass);

            setTimeout(() => {
                scoreP.classList.remove("updated", "glow", "burst");
                scoreO.classList.remove("updated", "glow", "burst");
            }, 600);
        }

        function refreshScores(animationKind = null) {
            const scale = scalesData[STATE.s] || {};

            const scoreP = document.getElementById("scoreP");
            const scoreO = document.getElementById("scoreO");

            scoreP.textContent = scale.scoreP || "";
            scoreO.textContent = scale.scoreO || "";

            scoreP.classList.toggle("active", STATE.p);
            scoreO.classList.toggle("active", !STATE.p);

            scoreP.style.backgroundColor = STATE.p ? "#050505" : "#757575";
            scoreO.style.backgroundColor = STATE.p ? "#757575" : "#050505";

            if (animationKind) {
                animateScores(animationKind);
            }
        }

        function refreshState() {
            document.getElementById("state").innerHTML =
                "<b>|BasicNodes|=" + G.nodes.length
                + ", |Links|=" + G.links.length
                + "</b>";
        }

        let hoverNode_BASIC = null;
        let ZOOM_cross = false;
        const highlightBasicNodes = new Set();
        const highlightBasicLinks = new Set();

        function clearBasicHILITE_Silent() {
            G.nodes.forEach(node => {
                node.HILITE = false;
            });
        }

        function HILITE_Basic_Me_and_MyNeig_Silent(id) {
            const node = G.nodes[id];
            if (!node) return;

            node.HILITE = true;

            (node.neighbors || []).forEach(neighborId => {
                const neighbor = G.nodes[neighborId];
                if (neighbor) {
                    neighbor.HILITE = true;
                }
            });
        }

        function clearBasicHoverContext() {
            hoverNode_BASIC = null;
            highlightBasicNodes.clear();
            highlightBasicLinks.clear();
            clearBasicHILITE_Silent();
            LABEL_clearHoverHtml(CTX_GBASIC);
        }

        function setBasicHover(node) {
            if ((!node && !highlightBasicNodes.size) || (node && hoverNode_BASIC === node)) return;

            clearBasicHoverContext();

            if (node) {
                HILITE_Basic_Me_and_MyNeig_Silent(node.id);
                highlightBasicNodes.add(node);

                (node.neighbors || []).forEach(neighborId => {
                    const neighbor = G.nodes[neighborId];
                    if (neighbor) {
                        highlightBasicNodes.add(neighbor);
                    }
                });

                (node.links || []).forEach(linkId => {
                    const link = G.links[linkId];
                    if (link) {
                        highlightBasicLinks.add(link);
                    }
                });
            }

            hoverNode_BASIC = node || null;
            refreshBasicNodeColors();
            refreshBasicNodeLabels();
            if (node) {
                LABEL_showHoverHtml(CTX_GBASIC, node);
            }
            else {
                LABEL_clearHoverHtml(CTX_GBASIC);
            }
            Graph.linkDirectionalParticles();
        }

        function FreezeGraph_GBASIC(ctx = CTX_GBASIC) {

        function basicShowLabelsCollectCurrentEntity(node) {

            const entityKey = basicShowLabelsEntityKeyAtChildScale(node);
            if (entityKey === null) return selected;

            G.nodes.forEach(candidate => {
                if (basicShowLabelsEntityKeyAtChildScale(candidate) === entityKey) {
                    selected.set(candidate.id, candidate);

        function basicShowLabelsApply(node, options = {}) {
            const selected = new Map();

            if (options.meNeighborhood) {

                });
            }

            if (options.currentEntity) {
                basicShowLabelsCollectCurrentEntity(node).forEach(candidate => {
                    selected.set(candidate.id, candidate);

            let added = 0;
            selected.forEach(candidate => {

            refreshBasicNodeLabels();
            refreshState();

            return { selected: selected.size, added };

        function placeBasicPopupOnEvent(menu, event) {
            if (!menu || !event) return;
            menu.style.display = "block";
            menu.style.visibility = "hidden";

            const left = Math.max(0, Math.round(event.clientX));
            const top = Math.max(0, Math.round(event.clientY - menu.offsetHeight));

            menu.style.left = left + "px";
            menu.style.top = top + "px";
            menu.style.visibility = "visible";
        }

        function initBasicMenuAttachedObjDrag(menu) {
            if (!menu || menu.dataset.dragInstalled === "true") return;
            menu.dataset.dragInstalled = "true";

            let dragging = false;
            let offsetX = 0;
            let offsetY = 0;

            menu.addEventListener("mousedown", event => {
                const header = event.target && event.target.closest
                    ? event.target.closest("#AO_header")
                    : null;
                if (!header || !menu.contains(header)) return;

                dragging = true;
                offsetX = event.clientX - menu.offsetLeft;
                offsetY = event.clientY - menu.offsetTop;
                menu.style.zIndex = "90";
                event.preventDefault();
            });

            document.addEventListener("mousemove", event => {
                if (!dragging) return;

                const maxLeft = Math.max(0, window.innerWidth - menu.offsetWidth);
                const maxTop = Math.max(0, window.innerHeight - menu.offsetHeight);
                const left = Math.min(Math.max(0, event.clientX - offsetX), maxLeft);
                const top = Math.min(Math.max(0, event.clientY - offsetY), maxTop);

                menu.style.left = Math.round(left) + "px";
                menu.style.top = Math.round(top) + "px";
            });

            document.addEventListener("mouseup", () => {
                dragging = false;
            });
        }

            const data = ctx.Graph.graphData();
            const nodes = data && Array.isArray(data.nodes) ? data.nodes : [];
            if (!nodes.length) {

            return nodes.every(n => (

                updateAwareControl();

            STATE.PLOT.aware = active;

            // layoutRunId is observed by PLOT_Vastur_Geometry_Unaware_GBASIC.
            STATE.PLOT.layoutRunId = (STATE.PLOT.layoutRunId || 0) + 1;

            const q = FOCUS_basicNode_Normalize(query);

            const id = FOCUS_basicNode_ExtractGbaseId(query);

        function FOCUS_basicNode_ReferenceMatches(query) {

            const items = FOCUS_basicNode_SearchData();

                return parent.BasicNodeReferenceFindMatches(items, query);

            const q = FOCUS_basicNode_Normalize(query).toLowerCase();
            if (q === "") return [];
            return items
                .filter(item => String(item.display || "").toLowerCase().includes(q) || String(item.label || "").toLowerCase().includes(q))

            const qLower = q.toLowerCase();

        function FOCUS_basicNode_RenderCompletion(matches) {
            const max = 1000;
            const shown = matches.slice(0, max);
            const html = shown.map((item, index) => {
                return '<div class="FOCUS_basicNode_completion_item" data-index="' + index + '">'
                    + FOCUS_basicNode_EscapeHTML(item.display)
                    + '</div>';
            }).join("") + (matches.length > max ? '<div class="FOCUS_basicNode_completion_more">...</div>' : "");

            FOCUS_basicNode_CompletionSetHTML(html);

            const completion = document.getElementById("FOCUS_basicNode_completion");
            if (!completion) return;

            completion.querySelectorAll(".FOCUS_basicNode_completion_item").forEach(elt => {
                elt.addEventListener("click", () => {
                    const index = Number(elt.getAttribute("data-index"));
                    const item = shown[index];
                    if (!item) return;

                    const input = document.getElementById("FOCUS_basicNode_input");
                    if (input) input.value = item.display;

                    FOCUS_basicNode_SetCurrent(item);
                    FOCUS_basicNode_ClearCompletion();
                    FOCUS_basicNode_SetValidCOM(item);
                    FOCUS_basicNode_SetGOEnabled(true);
                });
            });
        }

        function FOCUS_basicNode_UpdateFromInput() {
            const input = document.getElementById("FOCUS_basicNode_input");
            const query = input ? input.value : "";
            const q = FOCUS_basicNode_Normalize(query);

            FOCUS_basicNode_SetCurrent(null);
            FOCUS_basicNode_SetGOEnabled(false);
            FOCUS_basicNode_ClearCompletion();

            if (q === "") {
                FOCUS_basicNode_COMSetHTML("");
                return;
            }

            const exact = FOCUS_basicNode_FindExactReference(q);
            if (exact) {
                FOCUS_basicNode_SetCurrent(exact);
                FOCUS_basicNode_SetValidCOM(exact);
                FOCUS_basicNode_SetGOEnabled(true);
                return;
            }

            const matches = FOCUS_basicNode_ReferenceMatches(q);
            if (matches.length === 0) {
                FOCUS_basicNode_COMSetHTML("Absent from current Basic Nodes subgraph");
                return;
            }

            FOCUS_basicNode_SetCurrent(matches[0]);
            FOCUS_basicNode_SetGOEnabled(true);
            FOCUS_basicNode_COMSetHTML("");
            FOCUS_basicNode_RenderCompletion(matches);

        function initFOCUS_basicNodeDragResize() {
            const popup = document.getElementById("popupFOCUS_basicNode");

            if (!popup || !title || popup.dataset.dragInstalled === "true") return;
            popup.dataset.dragInstalled = "true";

            let dragging = false;
            let offsetX = 0;
            let offsetY = 0;

            title.addEventListener("mousedown", event => {
                if (event.target && event.target.id === "FOCUS_basicNode_close") return;

                FOCUS_basicNode_NormalizePopupGeometry();
                dragging = true;
                offsetX = event.clientX - popup.offsetLeft;
                offsetY = event.clientY - popup.offsetTop;
                popup.style.zIndex = "120";
                event.preventDefault();
            });

            document.addEventListener("mousemove", event => {
                if (!dragging) return;

                const maxLeft = Math.max(0, window.innerWidth - popup.offsetWidth);
                const maxTop = Math.max(0, window.innerHeight - popup.offsetHeight);
                const left = Math.min(Math.max(0, event.clientX - offsetX), maxLeft);
                const top = Math.min(Math.max(0, event.clientY - offsetY), maxTop);

                popup.style.left = Math.round(left) + "px";
                popup.style.top = Math.round(top) + "px";
            });

            document.addEventListener("mouseup", () => {
                dragging = false;

                (GBASE.nodes && Array.isArray(GBASE.nodes))
                    ? GBASE.nodes.length
                    : 0;

            const nbEdges =
                (GBASE.links && Array.isArray(GBASE.links))
                    ? GBASE.links.length

            badge.innerHTML =
                graphName

                + "Basic Nodes: " + nbVertices
                + "<br>"
                + "Edges: " + nbEdges
                + "<br><br>"
                + "GRAPH of"
                + "<br>"
                + "SCALE ENTITIES";
        }


        function updateEntitySiTitle(animate = false) {
            const el = document.querySelector("#state");
            if (!el) return;

            const G =
                (typeof CTX_GENTITY_si !== "undefined" && CTX_GENTITY_si && CTX_GENTITY_si.Gjson)

                    : (
                        (typeof GENTITY_si !== "undefined")
                            ? GENTITY_si

                    );

        function getVisibleBasicNodesCoveredCount(ctx = CTX_GENTITY_si) {
            return Number(getVisibleState_ENTITY_si(ctx).bnc || 0);
        }


        // Context popup generic helpers.

        function makeDraggable(menu, options = {}) {
            let dragging = false;
            let offsetX_ENTITY_Si = 0;
            let offsetY_ENTITY_Si = 0;

            menu.addEventListener("mousedown", (e) => {

                if (
                    options.headerId &&
                    e.target.id !== options.headerId
                ) {
                    return;
                }

                if (
                    options.ignoreInputs &&
                    e.target.tagName === "INPUT"
                ) {
                    return;
                }

                dragging = true;

                offsetX_ENTITY_Si = e.clientX - menu.offsetLeft;
                offsetY_ENTITY_Si = e.clientY - menu.offsetTop;

                if (options.onStart) {
                    options.onStart();
                }

                e.preventDefault();
            });

            document.addEventListener("mousemove", (e) => {

                if (!dragging) return;

                menu.style.left = `${e.clientX - offsetX_ENTITY_Si}px`;
                menu.style.top = `${e.clientY - offsetY_ENTITY_Si}px`;
            });

            document.addEventListener("mouseup", () => {

                if (!dragging) return;

                dragging = false;

                if (options.onEnd) {
                    options.onEnd();
                }
            });
        }


        function getContextPopups() {
            return CONTEXT_POPUP_IDS
                .map(id => document.getElementById(id))
                .filter(Boolean);
        }


        function isInsideContextPopup(target) {
            return getContextPopups().some(menu => menu.contains(target));
        }


        function closeContextPopups(exceptId = null) {
            getContextPopups().forEach(menu => {
                if (menu.id !== exceptId) {
                    menu.style.display = "none";
                }
            });
        }


        function initContextPopupAutoClose() {
            return window.GREEX_SHARED.initContextPopupAutoClose({
                doc: document,
                popupIds: CONTEXT_POPUP_IDS,
                flagName: "__contextPopupAutoCloseInstalled"
            });
        }


        function placePopupBottomLeftOnNode(menu, node) {
            if (!menu || !node) return;

            // Need display:block before measuring offsetHeight.
            menu.style.visibility = "hidden";
            menu.style.display = "block";

            const ref = menu.offsetParent || document.getElementById("graph-wrapper") || document.body;
            const p = nodeScreenPoint(node, ref);

            // Popup placement: bottom-left corner centered on the projected node.
            menu.style.left = `${Math.round(p.x)}px`;
            menu.style.top = `${Math.round(p.y - menu.offsetHeight)}px`;

            menu.style.visibility = "visible";
        }


        function showMenuAttachedObj(event, node) {
            closeContextPopups("menuAttachedObj");
            updateMenuAttachedObj(node);
            const menu = document.getElementById("menuAttachedObj");
            placePopupBottomLeftOnNode(menu, node);
        }


        function updateMenuAttachedObj(node) { //DONE

            const menu = document.getElementById("menuAttachedObj");

            menu.innerHTML = `<h2 id="AO_header">HOW TO SEE THE VERTICE: ${myIdLabelString(node.id)}</h2>

                                        <div class="obj-line">
                                            <label><input type="checkbox" id="AO_visible"> VERTICE VISIBLE</label>
                                        </div>

                                        <div class="obj-line">
                                            Ctrl + Right Click is inactive for label editing. Use Ctrl + Left Click to cycle label state: none → normal → big.
                                        </div>

                                        <hr>

                                        <button id="AO_apply">APPLY</button>
                                    `;

                const state_visible_0 = GENTITY_si.nodes[node.id].visible;
            document.getElementById("AO_visible").checked = state_visible_0;

                document.getElementById("AO_apply").onclick = () => {
                const state_visible_1 = document.getElementById("AO_visible").checked;
                setNod_visible_Silent(node.id, state_visible_1);

                if (!(state_visible_0 === state_visible_1)) {
                    if (state_visible_1) {
                        STATE_GENTITY_si.lback.push(makeVisibilityCommit("ADD", [node.id], { T: "ME", ID: node.id, s: STATE_GENTITY_si.s, a: "", b: "" }));
                    }
                    else {
                        STATE_GENTITY_si.lback.push(makeVisibilityCommit("REM", [node.id], { T: "ME", ID: node.id, s: STATE_GENTITY_si.s, a: "", b: "" }));
                    }
                    RefreshVisibility();
                }
                else {
                    RefreshEntityLabels();
                }

                document.getElementById("menuAttachedObj").style.display = "none";
