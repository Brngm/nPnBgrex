    <style>
        /* :root */
        :root {
            /* PAGE / GENERAL BACKGROUND */
            /*
                pageFond_color: general page background color.
                    black      => black background around the graph
                    #f9f9f9    => restore the light background
                    white      => white background

                panelFond_color: background color of the top panels: scalePanel and scorePanel.

                graphLargeur_reference: shared width used by:
                    - scalePanel
                    - scorePanel
                    - toolbar
                    - graph display frame

                graphEspace_haut: small space between scorePanel and the graph.
            */
            --pageFond_color: black;
            --panelFond_color: white;
            --graphLargeur_reference: calc(50vw * 1.618);
            --graphEspace_haut: 6px;

            /* TOOLBAR POSITION */
            --toolbar-top-entity: 85px;
            --toolbar-top-basic: 85px;

            /* POPUP VISIBILITY FROM GROUND */
            --menuVisibilityGround_width: 460px;

            /* VISIBILITY COM / REGEX — common transparent presentation */
            --VISIBILITY_COM_BG: transparent;
            --VISIBILITY_COM_COLOR: #1f1f1f;
            --VISIBILITY_COM_ERROR_COLOR: #8a0000;
        }

        :root {
            /* LOGO nPnB PROGRAMMABLE */
            /*
                The logo is made of 6 adjustable elements here:
                    - logoFond
                    - logo-top
                    - logo-left
                    - logo-center
                    - logo-right
                    - logo-text = "nPnB" text

                For each sign:

                    *_color  : sign color
                    *_taille : relative sign size
                        1.0  = normal size
                        1.2  = +20%
                        0.8  = -20%

                    *_pos_x  : individual horizontal offset
                        positive value => to the right
                        negative value => to the left

                    *_pos_y  : individual vertical offset
                        positive value => downward
                        negative value => upward

                logoEntier_* acts on the whole logo as one block.
            */

            /* LOGO ENTIER ---------------------------------------------------------- */
            --logoEntier_taille: 58px;
            --logoEntier_pos_x: 105px;
            --logoEntier_pos_y: 10px;

            /* LOGO BACKGROUND ------------------------------------------------------ */
            --logoFond_color: transparent;

            
            /* TOP SIGN ------------------------------------------------------------- */
            --logo-top_color: white;
            
            --logo-top_taille: 1.0;
            --logo-top_pos_x: 0px;
            --logo-top_pos_y: 0px;

            /* SIGNE GAUCHE --------------------------------------------------------- */
            --logo-left_color: white;
            
            --logo-left_taille: 1.0;
            --logo-left_pos_x: -70px;
            --logo-left_pos_y: 10px;

            /* SIGNE CENTRAL -------------------------------------------------------- */
            --logo-center_color: white;
            
            --logo-center_taille: 1.20;
            --logo-center_pos_x: 2px;
            --logo-center_pos_y: 11px;

            /* SIGNE DROIT ---------------------------------------------------------- */
            --logo-right_color: white;
            
            --logo-right_taille: 1.0;
            --logo-right_pos_x: 70px;
            --logo-right_pos_y: 10px;

            /* nPnB TEXT ------------------------------------------------------------ */
            --logo-text_color: #F2E8CF;
            --logo-text_taille: 1.6;
            --logo-text_pos_x: 0px;
            --logo-text_pos_y: 0px;
        }

        .float-tooltip-kap {
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
            padding: 0 !important;

            max-width: 1000px;
            /* Maximum logo text width: adjust here. */

            white-space: normal;
            /* one line whenever possible */
            overflow-wrap: break-word;
            /* if a word is too long, it is clipped */
            word-break: normal;
            /* do not break words unnecessarily */
        }


        /* VISIBILITY COM / REGEX — common component
           Applies to mother and child windows: COM areas are transparent. */
        .VIS_COM_REGEX,
        .VIS_errorCOM,
        .FOCUSpropCOM {
            background: var(--VISIBILITY_COM_BG, transparent);
            color: var(--VISIBILITY_COM_ERROR_COLOR, #8a0000);
            font-weight: bold;
            font-size: 12px;
            min-height: 20px;
            padding: 4px 6px 2px 6px;
            margin-top: 6px;
            box-sizing: border-box;
            text-align: left;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        body {
            /* general layout margins */
            margin-left: 15%;
            margin-right: 0;
            height: 100%;
            font-size: 12px;
            font-family: Arial;
            background: var(--pageFond_color);
        }

        #graph-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            border: none;
            overflow: hidden;
        }


        #LOGO_nPnB_svg {
            .float-tooltip-kap {
                white-space: nowrap !important;
            }

            position: absolute;
            top: var(--logoEntier_pos_y);
            left: var(--logoEntier_pos_x);
            width: var(--logoEntier_taille);
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
            overflow: visible;
        }

        #LOGO_nPnB_svg .logo-bg {
            fill: var(--logoFond_color);
        }

        #LOGO_nPnB_svg .logo-top,
        #LOGO_nPnB_svg .logo-left,
        #LOGO_nPnB_svg .logo-center,
        #LOGO_nPnB_svg .logo-right,
        #LOGO_nPnB_svg .logo-text {
            transform-box: fill-box;
            transform-origin: center;
        }

        #LOGO_nPnB_svg .logo-top {
            fill: var(--logo-top_color);
            transform: translate(var(--logo-top_pos_x), var(--logo-top_pos_y)) scale(var(--logo-top_taille));
        }

        #LOGO_nPnB_svg .logo-left {
            fill: var(--logo-left_color);
            transform: translate(var(--logo-left_pos_x), var(--logo-left_pos_y)) scale(var(--logo-left_taille));
        }

        #LOGO_nPnB_svg .logo-center {
            fill: var(--logo-center_color);
            transform: translate(var(--logo-center_pos_x), var(--logo-center_pos_y)) scale(var(--logo-center_taille));
        }

        #LOGO_nPnB_svg .logo-right {
            fill: var(--logo-right_color);
            transform: translate(var(--logo-right_pos_x), var(--logo-right_pos_y)) scale(var(--logo-right_taille));
        }

        #LOGO_nPnB_svg .logo-text {
            fill: var(--logo-text_color);
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            font-size: 56px;
            transform: translate(var(--logo-text_pos_x), var(--logo-text_pos_y)) scale(var(--logo-text_taille));
        }

        }

        #TitleBadge {
            text-align: center !important;
            line-height: 1.25 !important;
            white-space: nowrap !important;
        }

        /* ============================================================
            PANEL CSS — UNIFIED VERSION
           The three information lines use the same logic.
           Modify only here to adjust Scale / Scores / State.
           ============================================================ */

        :root {
            --PANEL_PAD_X: 6px;
            --PANEL_PAD_Y: 0px;

            --PANEL_LABEL_SIZE: 14px;
            --PANEL_VALUE_SIZE: 16px;

            --PANEL_LINE_HEIGHT: 1.10;

            --VALUE_PAD_Y: 3px;
            --VALUE_PAD_X: 9px;

            --VALUE_MARGIN_TOP: 2px;
            --VALUE_MARGIN_BOTTOM: 4px;

            --WWW_HEIGHT: var(--graphEspace_haut);
        }

        #scalePanel,
        #scorePanel,
        #statePanel {
            width: var(--graphLargeur_reference);
            max-width: 100%;
            box-sizing: border-box;

            background: var(--panelFond_color);
            color: black;

            margin: 0;
            padding: var(--PANEL_PAD_Y) var(--PANEL_PAD_X);
        }

        #scalePanel h1,
        #scorePanel h1,
        #statePanel h1 {
            display: inline-block;

            margin: 0;
            padding: 0;

            line-height: var(--PANEL_LINE_HEIGHT);
            vertical-align: baseline;
        }

        #Scale-buttonS {
            display: inline-block;
            margin: 0;
            padding: 0;
            vertical-align: baseline;
        }

        #TScales,
        #TScores,
        #TState {
            display: inline-block;

            margin-left: 0px;

            padding: 0px;

            font-weight: bold;

            font-size: 16px;

            line-height: 1.0;
        }

        #scoreP,
        #state {
            display: inline-block;

            margin-top: 500px;
            margin-bottom: 500px;
            margin-left: 0;

            font-weight: bold;

            font-size: 16px;
            line-height: 1.1;

            color: black;
            background-color: white;
            border-radius: 3px;

            transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;

            vertical-align: baseline;
        }

        #WWW {
            display: block;

            height: var(--WWW_HEIGHT);
            min-height: 0;

            margin: 0;
            padding: 0;

            line-height: 0;
            font-size: 0;
        }

        #NamePedig {
            display: none;
        }

        .FOCUSpanel-title-text,
        .FOCUSvisTitle {
            min-width: 0 !important;
            max-width: 100% !important;
            white-space: normal !important;
            overflow-wrap: anywhere !important;
            word-break: normal !important;
            hyphens: auto !important;
            line-height: 1.15 !important;
        }


        /* Shared appearance for the 4 visibility-panel titles.
           Adjust here for menuLDCON titles in the main document. */
        .visibilityTitle {
            box-sizing: border-box;
            display: block;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            margin: 2px 0 4px 0;
            padding: 5px 8px;
            border-radius: 2px;
            background: #616060;
            color: #fff;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 12px;
            font-weight: bold;
            line-height: 1.15;
            text-align: center;
            white-space: normal !important;
            overflow-wrap: anywhere !important;
            word-break: normal !important;
            hyphens: auto;
        }

        #menuLDCON h2.visibilityTitle,
        #menuVizFromNode h2.visibilityTitle {
            margin: 2px 2px 4px 2px;
        }

        /* KaTeX often emits nowrap/inline-block spans. Visibility titles must remain plain/wrappable. */
        .visibilityTitle .katex,
        .visibilityTitle .katex-html,
        .visibilityTitle .base {
            white-space: normal !important;
            overflow-wrap: anywhere !important;
            max-width: 100% !important;
        }


        .FOCUSpropRegexExamples {
            margin: 2px auto 4px auto;
            width: min(360px, 96%);
            color: #222222;
            font-size: 11px;
            line-height: 1.2;
            text-align: left;
            font-weight: normal;
        }

        .FOCUSpropRegexExamples div {
            margin: 1px 0;
        }

        .VIS_choiceDetail {
            margin-top: 4px;
            font-size: 0.95em;
            font-weight: normal;
            line-height: 1.25;
            overflow-wrap: anywhere;
        }

        /* ============================================================
            VIS MODEL - canonical Choice presentation
           One model for all visibility Choice titles and vertical rhythm.
           Existing popup implementations are attached to this model here.
           ============================================================ */
        :root {
            --VIS_choice-space-medium: 26px;
            --VIS_choice-space-small: 8px;
            --VIS_choice-title-font-size: 15px;
            --VIS_choice-title-weight: 700;
            --VIS_choice-title-line-height: 1.28;
        }

        /* Choice block containers: real VISIBILITY popups. */
        .action-blocVizFromNode,
        .action-blocLDCON {
            margin: var(--VIS_choice-space-medium) 0 12px 0;
        }

        /* Choice titles: one common visual rule for all current/future VIS choices. */
        .action-blocVizFromNode>h3,
        .action-blocLDCON>h3 {
            margin: 0;
            font-size: var(--VIS_choice-title-font-size);
            font-weight: var(--VIS_choice-title-weight);
            line-height: var(--VIS_choice-title-line-height);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-decoration: underline;
        }

        /* Small space between the Choice title/input zone and the ADD/REM/ONL row. */
        .action-blocVizFromNode .btn-desc-rowVizFromNode,
        .action-blocLDCON .btn-desc-rowLDCON {
            margin-top: var(--VIS_choice-space-small);
        }
    </style>
</head>

    <script> // GBASE DECODING, LABEL ACCESSORS AND ENTITY GRAPH BUILDERS
        // makeJson_ENTITY_Si : GBASE -> Graph_ENTITY_Si

        function readUnicode(s) {
            if (s === undefined || s === null) return "";
            return String(s).replace(/\\u([0-9a-fA-F]{4})/g, function (_, hex) {
                return String.fromCharCode(parseInt(hex, 16));
            });
        }

        function myStringFromGBASE(s) {
            return readUnicode(s);
        }

        function myNameStringFromGBASE(G) {
            return myStringFromGBASE(G ? G.name : "");
        }

        function myNameStringGBASE() {
            return myNameStringFromGBASE(GBASE);
        }

        function myIdLabelStringGBASE(id) {
            return myStringFromGBASE(GBASE.nodes[id].name);
        }

        function graphEndpointId(x) {
            return (x && typeof x === "object") ? x.id : x;
        }


        function computeBasicNodeDegrees(GBASE) {


            var degById = new Map();
            var i;

            for (i = 0; i < GBASE.nodes.length; i++) {
                degById.set(GBASE.nodes[i].id, 0);
            }

            for (i = 0; i < GBASE.links.length; i++) {
                var link = GBASE.links[i];
                var sourceId = graphEndpointId(link.source);
                var targetId = graphEndpointId(link.target);

                degById.set(sourceId, (degById.get(sourceId) || 0) + 1);
                degById.set(targetId, (degById.get(targetId) || 0) + 1);
            }

            return degById;
        }

        function updateEntityRepresentativeLabels(entityInfo, node, degree, maxLabels) {

            if (!entityInfo.representatives) {
                entityInfo.representatives = [];
            }

            entityInfo.representatives.push({
                id: node.id,
                name: myIdLabelStringGBASE(node.id),
                degree: degree || 0
            });

            entityInfo.representatives.sort(function (a, b) {
                if (b.degree !== a.degree) return b.degree - a.degree;
                return Number(a.id) - Number(b.id);
            });

            if (entityInfo.representatives.length > maxLabels) {
                entityInfo.representatives.length = maxLabels;
            }
        }

        function makeEntityName(Id_Entity, representatives) {

            var name = ""
            var labels = [];

            if (representatives) {
                for (i = 0; i < representatives.length; i++) {
                    if (representatives[i].name !== undefined && representatives[i].name !== null) {
                        labels.push(String(representatives[i].name));
                    }
                }
            }

            if (labels.length > 0) {
                name += "\u2022" + labels.join(" \u2022");

            }
            else {
                name += "{?}=?";
            }

            return name;
        }

        function makeJson_ENTITY_Si(GBASE, id_s) {


            function getPartitionEntity(node) {
                return node.group[id_s][0]; // partition only, overlaps ignored
            }


            // Data helpers.

            function shuffle(X) {
                                for (let i = X.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [X[i], X[j]] = [X[j], X[i]];
                }
                return X;
            }

            var i;
            var maxRepresentativeLabels = 2;

            var basicIdToNode = new Map();
            var basicDegreeById = computeBasicNodeDegrees(GBASE);
            var entityInfo = new Map();

            for (i = 0; i < GBASE.nodes.length; i++) {
                var node = GBASE.nodes[i];

                basicIdToNode.set(node.id, node);

                var Id_Entity = getPartitionEntity(node);

                if (!entityInfo.has(Id_Entity)) {
                    entityInfo.set(Id_Entity, {
                        Id_Entity: Id_Entity,
                        nb_Basic_Nodes_Covered: 0,
                        representatives: []
                    });
                }

                var info = entityInfo.get(Id_Entity);
                info.nb_Basic_Nodes_Covered++;

                updateEntityRepresentativeLabels(
                    info,
                    node,
                    basicDegreeById.get(node.id) || 0,
                    maxRepresentativeLabels
                );
            }

            var entityList = Array.from(entityInfo.values());

            entityList.sort(function (a, b) {
                return a.Id_Entity - b.Id_Entity;
            });

            var Entity2Node = new Map();
            var nodes = [];

            for (i = 0; i < entityList.length; i++) {
                Entity2Node.set(entityList[i].Id_Entity, i);

                nodes.push({
                    id: i,

                    Id_Entity: entityList[i].Id_Entity,

                    name: "|{" + makeEntityName(entityList[i].Id_Entity, entityList[i].representatives)
                        + ((entityList[i].nb_Basic_Nodes_Covered < 3) ? "" : "\u00A0\u2026")
                        + "}|" + "=" + entityList[i].nb_Basic_Nodes_Covered,

                    nb_Basic_Nodes_Covered: entityList[i].nb_Basic_Nodes_Covered
                });
            }

            var aggLinks = new Map();

            for (i = 0; i < GBASE.links.length; i++) {
                var link = GBASE.links[i];

                var sourceNode = basicIdToNode.get(graphEndpointId(link.source));
                var targetNode = basicIdToNode.get(graphEndpointId(link.target));

                if (!sourceNode || !targetNode) continue;

                var entityS = getPartitionEntity(sourceNode);
                var entityT = getPartitionEntity(targetNode);

                if (entityS === entityT) continue;

                var a = Entity2Node.get(entityS);
                var b = Entity2Node.get(entityT);

                if (a === undefined || b === undefined) continue;

                if (a > b) {
                    var tmp = a;
                    a = b;
                    b = tmp;
                }

                var key = a + "|" + b;

                if (!aggLinks.has(key)) {
                    aggLinks.set(key, {
                        source: a,
                        target: b,
                        nb_Basic_Links_Covered: 0
                    });
                }

                aggLinks.get(key).nb_Basic_Links_Covered++;
            }

            var links = [];
            var idLink = 0;
            var totalBasicLinks = Math.max(GBASE.links.length, 1);

            aggLinks.forEach(function (L) {
                links.push({
                    id: idLink++,
                    source: L.source,
                    target: L.target,
                    value: 10 * L.nb_Basic_Links_Covered / totalBasicLinks,
                    nb_Basic_Links_Covered: L.nb_Basic_Links_Covered
                });
            });

            return {
                name: myNameStringFromGBASE(GBASE),
                s: id_s,
                meta: {
                    vertexType: "ENTITY",
                    source: "GBASE",
                    kind: "Graph_ENTITY_Si"
                },
                nodes: nodes,
                links: links,
                Entity2Node: Entity2Node
            };
        }
    </script>

    <script> // GENTITY SCALE, SCORE AND PLOT CONFIRMATION WORKFLOW
        // Scale/plot safety globals.

        let SAFE_TRIGGER_BUSY_ENTITY_si = false;
        let SAFE_LAYOUT_RUN_ID_ENTITY_si = 0;


        function extractEntityCountFromScoreP_ENTITY_si(id_s) {
            const scoreP = GBASE?.scales?.[id_s]?.scoreP;
            const match = String(scoreP || "").match(/\|=(\d+):/);
            return match ? Number(match[1]) : null;
        }

        function loadGBASEFromDOM() {

            const el = document.getElementById("graph-json");

            const G = JSON.parse(el.textContent);

            // free the original JSON text stored in the DOM
            el.textContent = "";

            return G;
        }

        function chooseInitialScaleId(G, pref) {
            let bestDistance = G.nodes.length;
            let bestScaleId = 0;

            for (let i = 0; i < G.scales.length; i++) {
                const nb_entities = extractEntityCountFromScoreP_ENTITY_si(i);
                const distance = Math.abs(nb_entities - pref.CognitiveThreshold.maxVisibleVERTICES);

                if (distance < bestDistance) {
                    bestScaleId = i;
                    bestDistance = distance;
                }
            }

            return bestScaleId;
        }

        function getScaleButtonCount(G) {
            G.scales = G.scales || [];

            let maxNumScale = 0;

            for (let i = 0; i < G.nodes.length; i++) {
                const n = G.nodes[i];
                const groupLength = n.group ? n.group.length : 0;

                if (groupLength > maxNumScale) {
                    maxNumScale = groupLength;
                }
            }

            return Math.min(G.scales.length, maxNumScale);
        }

        function buildInitialGENTITY(G, state) {
            return makeJson_ENTITY_Si(G, state.s);
        }


        // Scale buttons / score controls / plot confirmation.

        function createScaleButtons() {

            for (let i = 0; i < numScaleButton_ENTITY_Si; i++) {

                doc: document,
                selector: ".scale-button",
                isActive: (btn) => btn.textContent === String(GBASE.scales[STATE_GENTITY_si.s]["s"])
            });

        function entitySiGraphDescriptionFromScale(id_s) {
            const nbEntities = extractEntityCountFromScoreP_ENTITY_si(id_s);

                + "|V|=" + vText;

        function plotNeedsConfirmation_ENTITY_si(id_s) {
            const nbEntities = extractEntityCountFromScoreP_ENTITY_si(id_s);

            // If the score string cannot be parsed, stay conservative and ask confirmation.
            if (nbEntities === null) return true;

        function SAFE_validateGENTITY_si(GENTITY_si, id_s) {
            if (!GENTITY_si || !Array.isArray(GENTITY_si.nodes) || !Array.isArray(GENTITY_si.links)) {
                throw new Error("GENTITY_si invalide");
            }
            if (GENTITY_si.nodes.length === 0) {
                throw new Error("GENTITY_si vide");
            }

            const ids = new Set(GENTITY_si.nodes.map(n => String(n.id)));
            for (const l of GENTITY_si.links) {
                const sid = String(typeof l.source === "object" ? l.source.id : l.source);
                const tid = String(typeof l.target === "object" ? l.target.id : l.target);
                if (!ids.has(sid) || !ids.has(tid)) {
                    throw new Error("Lien invalide: source/target absent des nodes");
                }
                if (!Number.isFinite(Number(l.value))) {
                    l.value = 1;
                }
            }

            for (const n of GENTITY_si.nodes) {
                if (!Number.isFinite(Number(n.val)) || Number(n.val) <= 0) n.val = 1;
                if (!Number.isFinite(Number(n.nb_Basic_Nodes_Covered)) || Number(n.nb_Basic_Nodes_Covered) <= 0) {
                    n.nb_Basic_Nodes_Covered = 1;

        function startDisplayTimer_ENTITY_si() {
            STATE_GENTITY_si.PLOT.currentDisplayStartTime = performance.now();

        function storeFirstDisplayTimeRef_ENTITY_si(ctx) {
            if (
                ctx.type !== "ENTITY_Si" ||
                !ctx.STATE ||
                !ctx.STATE.PLOT ||
                !ctx.STATE.PLOT.displayTimeRef ||
                ctx.STATE.PLOT.displayTimeRef.T0 !== null ||
                !Number.isFinite(ctx.STATE.PLOT.currentDisplayStartTime)
            ) {
                return;
            }

            ctx.STATE.PLOT.displayTimeRef.T0 =
                (performance.now() - ctx.STATE.PLOT.currentDisplayStartTime) / 1000;

                ctx.Gjson.nodes.length;

        function clearDisplayTimer_ENTITY_si(ctx = CTX_GENTITY_si) {

                ctx.STATE.PLOT.currentDisplayStartTime = null;

        function estimatePlotDisplaySeconds_ENTITY_si(entityCount) {
            const ref = STATE_GENTITY_si?.PLOT?.displayTimeRef;

            if (
                !ref ||
                !Number.isFinite(ref.T0) ||
                !Number.isFinite(ref.V0) ||
                ref.T0 <= 0 ||
                ref.V0 <= 0 ||
                !Number.isFinite(entityCount) ||
                entityCount <= 0
            ) {
                return null;
            }

            return ref.T0 * entityCount / ref.V0;
        }


        function formatPlotDisplayEstimate_ENTITY_si(seconds) {
            if (!Number.isFinite(seconds) || seconds <= 0) {
                return "unknown";

            if (seconds < 1) {

            if (seconds < 10) {
                return seconds.toFixed(1) + " seconds";

            return Math.round(seconds) + " seconds";

    <script> // GENTITY SPRITES, LINKS AND GEOMETRY PREPARATION
        // Prepare GENTITY_si.
        function prepareGENTITY_si(G) {
            G.nodes.forEach(node => {
                node.visible = true;
                node.deg = 0;
                node.val = 0;
                node.neighbors = [];
                node.links = [];
                node.LabelState = 0;
                node.HILITE = false;

                // Label graphics are created lazily by LABEL_cycleState().
                // No SpriteText is allocated during graph preparation.
            });

            G.links.forEach(link => {
                link.visible = true;

                const sourceId = (link.source && typeof link.source === "object") ? link.source.id : link.source;
                const targetId = (link.target && typeof link.target === "object") ? link.target.id : link.target;

                const a = G.nodes[sourceId];
                const b = G.nodes[targetId];

                if (!a || !b) return;

                a.deg = a.deg + 1;
                b.deg = b.deg + 1;

                a.val = a.val + PREF.NODE.Radius;
                b.val = b.val + PREF.NODE.Radius;

                !a.neighbors && (a.neighbors = []);
                !b.neighbors && (b.neighbors = []);
                a.neighbors.push(b.id);
                b.neighbors.push(a.id);

                !a.links && (a.links = []);
                !b.links && (b.links = []);
                a.links.push(link.id);
                b.links.push(link.id);
            });

            return G;
        }

        prepareGENTITY_si(GENTITY_si);

        // Shared lazy label engine for Entity/BasicNode contexts.
        function LABEL_ensure(ctx) {
            if (!ctx.LABEL) ctx.LABEL = {};
            if (!ctx.LABEL.fixedSprites) ctx.LABEL.fixedSprites = new Map();
            return ctx.LABEL;
        }

        function LABEL_nodeId(ctx, node) {
            const label = LABEL_ensure(ctx);
            return typeof label.getNodeId === "function" ? label.getNodeId(node) : node.id;
        }

        function LABEL_text(ctx, node) {
            const label = LABEL_ensure(ctx);
            return typeof label.getLabelText === "function" ? label.getLabelText(node) : String(node.id);
        }

        function LABEL_visible(ctx, node) {
            const label = LABEL_ensure(ctx);
            return typeof label.isVisible === "function" ? label.isVisible(node) : node.visible !== false;
        }

        function LABEL_size(ctx, node) {
            const label = LABEL_ensure(ctx);
            return typeof label.getLabelSize === "function" ? label.getLabelSize(node) : PREF.LABEL.sizeFixed;
        }

        function LABEL_graphObject(ctx, node) {
            const label = LABEL_ensure(ctx);
            if (typeof label.getGraphObject === "function") return label.getGraphObject(node);
            return node.__sphere || null;
        }

        function LABEL_state(node) {
            const state = Number(node && node.LabelState);
            return (state === 1 || state === 2) ? state : 0;
        }

        function LABEL_setState(ctx, node, state) {
            if (!node) return;
            const normalized = ((Number(state) || 0) % 3 + 3) % 3;
            node.LabelState = normalized;
            if (normalized === 0) {
                LABEL_removeFixed(ctx, node);
            }
            else {
                LABEL_createFixed(ctx, node);
            }
        }

        function LABEL_applySpriteStyle(ctx, node, sprite) {
            sprite.visible = LABEL_visible(ctx, node) && LABEL_state(node) > 0;
            sprite.color = "black";
            sprite.backgroundColor = "rgba(255,255,255,0)";
            sprite.textHeight = LABEL_size(ctx, node);
        }

        function LABEL_createFixed(ctx, node) {
            if (!node) return null;
            const label = LABEL_ensure(ctx);
            const id = LABEL_nodeId(ctx, node);
            let sprite = label.fixedSprites.get(id);
            if (!sprite) {
                const nbsp = "\u00A0";
                sprite = new SpriteText(nbsp + LABEL_text(ctx, node) + nbsp);
                sprite.onBeforeRender = (renderer) => renderer.clearDepth();
                sprite.material.depthWrite = false;
                sprite.material.depthTest = false;
                sprite.material.transparent = true;
                sprite.material.needsUpdate = true;
                sprite.renderOrder = 9999;
                sprite.textAlign = "left";
                sprite.center.set(0, 0);
                sprite.position.x = 0;
                sprite.raycast = () => {};

                const object3D = LABEL_graphObject(ctx, node);
                if (object3D) {
                    object3D.add(sprite);
                    sprite.position.set(0, 0, 0);
                    sprite.position.x = 0;
                }
                label.fixedSprites.set(id, sprite);
            }

            const object3D = LABEL_graphObject(ctx, node);
            if (object3D && sprite.parent !== object3D) {
                if (sprite.parent) sprite.parent.remove(sprite);
                object3D.add(sprite);
                sprite.position.set(0, 0, 0);
                sprite.position.x = 0;
            }

            LABEL_applySpriteStyle(ctx, node, sprite);
            return sprite;
        }

        function LABEL_disposeTexture(texture) {
            if (!texture) return;
            const image = texture.image;
            if (typeof texture.dispose === "function") texture.dispose();
            if (image && typeof image === "object") {
                if (typeof image.close === "function") {
                    try { image.close(); } catch (e) {}
                }
                if (typeof image.width === "number") image.width = 0;
                if (typeof image.height === "number") image.height = 0;
            }
            texture.image = null;
        }

        function LABEL_disposeMaterial(material) {
            if (!material) return;
            const materials = Array.isArray(material) ? material : [material];
            materials.forEach(mat => {
                if (!mat) return;
                [
                    "map", "alphaMap", "aoMap", "bumpMap", "displacementMap",
                    "emissiveMap", "envMap", "lightMap", "metalnessMap",
                    "normalMap", "roughnessMap", "specularMap", "gradientMap"
                ].forEach(key => {
                    LABEL_disposeTexture(mat[key]);
                    mat[key] = null;
                });
                if (typeof mat.dispose === "function") mat.dispose();
            });
        }

        function LABEL_disposeObject3D(object3D) {
            if (!object3D) return;
            object3D.traverse(obj => {
                if (obj.geometry && typeof obj.geometry.dispose === "function") obj.geometry.dispose();
                LABEL_disposeMaterial(obj.material);
                LABEL_disposeTexture(obj.texture);
                obj.texture = null;
                obj.onBeforeRender = null;
                obj.raycast = () => {};
            });
            object3D.clear();
        }

        function LABEL_disposeRendererLists(ctx) {
            const label = LABEL_ensure(ctx);
            const graph = typeof label.getGraph === "function" ? label.getGraph() : (ctx && ctx.Graph ? ctx.Graph : null);
            const renderer = graph && typeof graph.renderer === "function" ? graph.renderer() : null;
            if (renderer && renderer.renderLists && typeof renderer.renderLists.dispose === "function") {
                renderer.renderLists.dispose();
            }
        }

        function LABEL_afterFixedRemovalCleanup(ctx) {
            LABEL_disposeRendererLists(ctx);
            // Run again after rendering so Three.js/WebGL can release stale render-list references.
            const cleanup = () => LABEL_disposeRendererLists(ctx);
            if (typeof requestAnimationFrame === "function") {
                requestAnimationFrame(() => requestAnimationFrame(cleanup));
            }
            setTimeout(cleanup, 250);
        }

        function LABEL_removeFixed(ctx, nodeOrId, cleanupAfter = true) {
            const label = LABEL_ensure(ctx);
            const id = (typeof nodeOrId === "object") ? LABEL_nodeId(ctx, nodeOrId) : nodeOrId;
            const sprite = label.fixedSprites.get(id);
            if (!sprite) return;
            if (sprite.parent) sprite.parent.remove(sprite);
            label.fixedSprites.delete(id);
            LABEL_disposeObject3D(sprite);
            if (cleanupAfter) LABEL_afterFixedRemovalCleanup(ctx);
        }

        function LABEL_cycleState(ctx, node) {
            if (!node) return;
            LABEL_setState(ctx, node, LABEL_state(node) + 1);
        }

        function LABEL_refreshFixed(ctx) {
            const label = LABEL_ensure(ctx);
            Array.from(label.fixedSprites.keys()).forEach(id => {
                const node = typeof label.getNodeById === "function" ? label.getNodeById(id) : null;
                if (!node || LABEL_state(node) === 0) {
                    LABEL_removeFixed(ctx, id);
                }
            });

            if (typeof label.getNodes === "function") {
                label.getNodes().forEach(node => {
                    if (LABEL_state(node) > 0) LABEL_createFixed(ctx, node);
                });
            }
        }

        function LABEL_clearFixed(ctx) {
            const label = LABEL_ensure(ctx);
            Array.from(label.fixedSprites.keys()).forEach(id => LABEL_removeFixed(ctx, id, false));
            LABEL_afterFixedRemovalCleanup(ctx);
            if (typeof label.getNodes === "function") {
                label.getNodes().forEach(node => { node.LabelState = 0; });
            }
        }

        function LABEL_escape(ctx, value) {
            const label = LABEL_ensure(ctx);
            const s = String(value == null ? "" : value);
            if (typeof label.escapeHTML === "function") return label.escapeHTML(s);
            if (window.GREEX_SHARED && typeof window.GREEX_SHARED.escapeHTML === "function") return window.GREEX_SHARED.escapeHTML(s);
            return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function LABEL_graphElement(ctx) {
            const label = LABEL_ensure(ctx);
            if (typeof label.getGraphElement === "function") return label.getGraphElement();
            return document.getElementById("Graph3D");
        }

        function LABEL_hoverContainer(ctx) {
            const label = LABEL_ensure(ctx);
            if (label.hoverContainer) return label.hoverContainer;

            const graphEl = LABEL_graphElement(ctx);
            if (!graphEl) return null;

            if (getComputedStyle(graphEl).position === "static") {
                graphEl.style.position = "relative";
            }

            const container = document.createElement("div");
            container.className = "MIAP-hover-label-container";
            container.style.position = "absolute";
            container.style.left = "0";
            container.style.top = "0";
            container.style.width = "100%";
            container.style.height = "100%";
            container.style.pointerEvents = "none";
            container.style.overflow = "hidden";
            container.style.zIndex = "20";
            graphEl.appendChild(container);
            label.hoverContainer = container;
            return container;
        }

        function LABEL_neighborNodes(ctx, node) {
            const label = LABEL_ensure(ctx);
            if (typeof label.getNeighborNodes === "function") return label.getNeighborNodes(node);
            if (!node || !Array.isArray(node.neighbors) || typeof label.getNodeById !== "function") return [];
            return node.neighbors.map(id => label.getNodeById(id)).filter(Boolean);
        }

        function LABEL_projectToGraph(ctx, node) {
            const graph = ctx && ctx.Graph;
            const graphEl = LABEL_graphElement(ctx);
            if (!graph || !graphEl || typeof graph.camera !== "function" || !node) return null;

            const camera = graph.camera();
            if (!camera) return null;

            const rect = graphEl.getBoundingClientRect();
            const width = rect.width || graphEl.clientWidth || 1;
            const height = rect.height || graphEl.clientHeight || 1;
            const vector = new THREE.Vector3(node.x || 0, node.y || 0, node.z || 0).project(camera);
            if (!Number.isFinite(vector.x) || !Number.isFinite(vector.y) || !Number.isFinite(vector.z)) return null;
            if (vector.z < -1 || vector.z > 1) return null;

            return {
                x: (vector.x + 1) / 2 * width,
                y: (-vector.y + 1) / 2 * height
            };
        }

        function LABEL_makeHoverElement(ctx, node, cause) {
            const label = LABEL_ensure(ctx);
            const element = document.createElement("div");
            element.className = "MIAP-hover-label MIAP-hover-label-" + cause;
            element.innerHTML = LABEL_escape(ctx, LABEL_text(ctx, node));
            element.style.position = "absolute";
            element.style.left = "0";
            element.style.top = "0";
            element.style.transform = "translate(0, -100%)";
            element.style.fontSize = String((PREF.LABEL && PREF.LABEL.sizeHover) || 25) + "px";
            element.style.fontWeight = "bold";
            element.style.color = "black";
            element.style.backgroundColor = "rgba(255,255,255,0.75)";
            element.style.padding = "2px 4px";
            element.style.borderRadius = "4px";
            element.style.whiteSpace = "nowrap";
            element.style.pointerEvents = "none";
            element.style.willChange = "transform";
            label.hoverEntries.push({ node, element });
            return element;
        }

        function LABEL_renderHoverHtml(ctx) {
            const label = LABEL_ensure(ctx);
            if (!Array.isArray(label.hoverEntries)) return;

            label.hoverEntries.forEach(entry => {
                const pos = LABEL_projectToGraph(ctx, entry.node);
                if (!pos || !LABEL_visible(ctx, entry.node)) {
                    entry.element.style.display = "none";
                    return;
                }
                entry.element.style.display = "block";
                entry.element.style.left = Math.round(pos.x) + "px";
                entry.element.style.top = Math.round(pos.y) + "px";
            });
        }

        function LABEL_startHoverLoop(ctx) {
            const label = LABEL_ensure(ctx);
            if (label.hoverAnimationFrame) return;
            const tick = () => {
                if (!label.hoverEntries || label.hoverEntries.length === 0) {
                    label.hoverAnimationFrame = null;
                    return;
                }
                LABEL_renderHoverHtml(ctx);
                label.hoverAnimationFrame = requestAnimationFrame(tick);
            };
            label.hoverAnimationFrame = requestAnimationFrame(tick);
        }

        function LABEL_clearHoverHtml(ctx) {
            const label = LABEL_ensure(ctx);
            if (label.hoverAnimationFrame) {
                cancelAnimationFrame(label.hoverAnimationFrame);
                label.hoverAnimationFrame = null;
            }
            if (label.hoverContainer) {
                label.hoverContainer.innerHTML = "";
            }
            label.hoverEntries = [];
        }

        function LABEL_showHoverHtml(ctx, hoveredNode) {
            LABEL_clearHoverHtml(ctx);
            if (!hoveredNode || !LABEL_visible(ctx, hoveredNode)) return;

            const label = LABEL_ensure(ctx);
            const container = LABEL_hoverContainer(ctx);
            if (!container) return;

            label.hoverEntries = [];
            container.appendChild(LABEL_makeHoverElement(ctx, hoveredNode, "hovered"));

            const showNeighbors = ctx && ctx.STATE && ctx.STATE.CLick_node_L_01 === true;
            if (showNeighbors) {
                LABEL_neighborNodes(ctx, hoveredNode).forEach(neighbor => {
                    if (neighbor && neighbor !== hoveredNode && LABEL_visible(ctx, neighbor)) {
                        container.appendChild(LABEL_makeHoverElement(ctx, neighbor, "hover-neighbor"));
                    }
                });
            }

            LABEL_renderHoverHtml(ctx);
            LABEL_startHoverLoop(ctx);
        }


        CTX_GENTITY_si.LABEL = {
            fixedSprites: new Map(),
            getNodes: () => CTX_GENTITY_si.Gjson.nodes,
            getNodeById: id => CTX_GENTITY_si.Gjson.nodes[id],
            getNodeId: node => node.id,
            isVisible: node => isEntityVisible_ENTITY_si(node),
            getLabelText: node => EntityDisplayLabelString(node),
            getLabelSize: node => LABEL_state(node) === 2 ? 2 * PREF.LABEL.sizeFixed : PREF.LABEL.sizeFixed,
            getGraphObject: node => node.__sphere || null,
            getGraphElement: () => document.getElementById("Graph3D"),
            getGraph: () => Graph_ENTITY_Si,
            getNeighborNodes: node => (node.neighbors || []).map(id => CTX_GENTITY_si.Gjson.nodes[id]).filter(Boolean),
            escapeHTML: value => window.GREEX_SHARED.escapeHTML(value)
        };

        function resetPreferencesDialog() {

        function choose_your_preferences(DIC) {
            const prefDoc = getPreferenceDocument();
            const overlay = prefDoc.getElementById("prefOverlay");
            const content = prefDoc.getElementById("prefContent");
            if (!overlay || !content) return;
            content.innerHTML = "";
            buildForm(content, DIC, "");
            overlay.style.display = "block";
        }


        function buildForm(parent, obj, path) {
            const doc = parent.ownerDocument || document;
            Object.keys(obj).forEach(key => {
                const value = obj[key];
                if (
                    typeof value === "object" &&
                    value !== null &&
                    !Array.isArray(value)
                ) {
                    const section = doc.createElement("div");
                    section.className = "prefSection";
                    const title = doc.createElement("div");
                    title.className = "prefSectionTitle";
                    title.textContent = key;
                    section.appendChild(title);
                    parent.appendChild(section);
                    buildForm(
                        section,
                        value,
                        path ? path + "." + key : key
                    );

                }
                else {
                    const row = doc.createElement("div");
                    row.className = "prefRow";
                    const label = doc.createElement("div");
                    label.className = "prefLabel";
                    label.textContent = key;
                    let input;
                    if (typeof value === "boolean") {
                        input = doc.createElement("input");
                        input.type = "checkbox";
                        input.checked = value;
                    }
                    else if (typeof value === "number") {
                        input = doc.createElement("input");
                        input.type = "number";
                        input.step = "any";
                        input.value = value;
                    }
                    else {
                        input = doc.createElement("input");
                        input.type = "text";
                        input.value = value;
                    }
                    input.dataset.path = path ? path + "." + key : key;
                    row.appendChild(label);
                    row.appendChild(input);
                    parent.appendChild(row);
                }
            });
        }


        function savePreferences(DIC) {
            getPreferenceDocument()
                .querySelectorAll("#prefContent input")
                .forEach(input => {
                    const path = input.dataset.path.split(".");
                    let target = DIC;
                    for (let i = 0; i < path.length - 1; i++) {
                        target = target[path[i]];
                    }
                    const lastKey = path[path.length - 1];
                    if (input.type === "checkbox") {
                        target[lastKey] = input.checked;
                    }
                    else {
                        const oldValue = target[lastKey];
                        if (typeof oldValue === "number") {
                            target[lastKey] = Number(input.value);
                        }
                        else {
                            target[lastKey] = input.value;
                        }
                    }
                });
        }


        function APPLY_PREF() {
            Graph_ENTITY_Si.backgroundColor(
                PREF.BACKGROUND.backgroundColor
            );
            // Preferences may affect node geometry/materials/labels/links.
            // Rebuild is intentional here.
            Graph_ENTITY_Si.refresh();

            // After rebuild, force the explicit refresh layer too.
            // This keeps visibility/picking/colors/links synchronized immediately,

    <script> // MAIN GRAPH CONTAINER LAYOUT AND RESIZE HELPERS
        function getGraphDisplaySize(win = window) {
            const WinnerWidth = win.innerWidth;

            // Shared mother/child geometry: the graph frame is always
            // derived from the usable width of the current window.
            return {
                width: WinnerWidth * 0.5 * 1.618,
                height: WinnerWidth * 0.5
            };
        }


        function getGraphWindowGeometry() {
            const width = Math.round(window.outerWidth || window.innerWidth);
            const height = Math.round(window.outerHeight || window.innerHeight);
            const maxLeft = Math.max(0, window.screen.availWidth - width);
            const maxTop = Math.max(0, window.screen.availHeight - height);
            const left = Math.min(Math.max(0, Math.round((window.screenX || window.screenLeft || 0) + 30)), maxLeft);
            const top = Math.min(Math.max(0, Math.round((window.screenY || window.screenTop || 0) + 30)), maxTop);
            const graph = getGraphDisplaySize(window);

            return {
                width,
                height,
                left,
                top,
                graphWidth: Math.round(graph.width),
                graphHeight: Math.round(graph.height)
            };
        }


        function resizeGraphDisplay() {
            const size = getGraphDisplaySize();
            document.documentElement.style.setProperty('--graphLargeur_reference', `${size.width}px`);

            if (Graph_ENTITY_Si) {
                Graph_ENTITY_Si.width(size.width);

    <script> // GENTITY VISIBILITY ENGINE AND SELECTION OPERATIONS
        // Visibility state accessors / graph synchronization.

        function isEntityVisible_ENTITY_si(entity) {
            return entity && entity.visible !== false;
        }


        function updateVisibleState_ENTITY_si(ctx = CTX_GENTITY_si) {
            const state = ctxState(ctx);
            const G = ctx && ctx.Gjson ? ctx.Gjson : null;

            if (!state.VISIBLE) {
                state.VISIBLE = {};
            }

            let visibleEntities = 0;
            let visibleBNC = 0;

            if (G && Array.isArray(G.nodes)) {
                G.nodes.forEach(entity => {
                    if (!isEntityVisible_ENTITY_si(entity)) return;
                    visibleEntities += 1;
                    visibleBNC += Number(entity.nb_Basic_Nodes_Covered || 0);
                });
            }

            state.VISIBLE.entities = visibleEntities;
            state.VISIBLE.bnc = visibleBNC;

            return state.VISIBLE;
        }


        function getVisibleState_ENTITY_si(ctx = CTX_GENTITY_si) {
            const state = ctxState(ctx);
            if (!state.VISIBLE) {
                return updateVisibleState_ENTITY_si(ctx);
            }
            return state.VISIBLE;
        }


        function getVerticeVisible(ctx, id) {
            return ctxVertice(ctx, id).visible;
        }


        function setVerticeVisible_Silent(ctx, id, visible) {
            ctxVertice(ctx, id).visible = visible;
        }


        function setVerticeLabelState_Silent(ctx, id, state) {
            LABEL_setState(ctx, ctxVertice(ctx, id), state);
        }


        function RefreshNodeVisibility(ctx = CTX_GENTITY_si) {
            const graph = ctxGraph(ctx);
            const state = ctxState(ctx);
            const vertices = graph.graphData().nodes;
            updateVisibleState_ENTITY_si(ctx);

            for (let vertice of vertices) {

                const verticeVisible = isEntityVisible_ENTITY_si(vertice);

                if (!vertice.__sphere) continue;
                vertice.__sphere.visible = verticeVisible;
            }

            state.PLOT.nbVisibleNodes = getVisibleState_ENTITY_si(ctx).entities;

            if (typeof updateEntitySiTitle === "function") {
                updateEntitySiTitle(true);
            }

            // Important:
            // Hiding the THREE object is not enough for 3d-force-graph picking.
            // The graph engine must also re-read vertice.visible so invisible vertices
            // are not hoverable/clickable.
            graph.nodeVisibility(vertice => isEntityVisible_ENTITY_si(vertice));
        }

        function afterEntityVisibilityChanged(ctx = CTX_GENTITY_si) {
            resetFocusVisibilityPredictions(ctx);
            closeSubGraphBN();
        }


        function resetFocusVisibilityPredictions(ctx = CTX_GENTITY_si) {
            if (
                !isFOCUS_entity_by_BN_Open() ||
                !windowFOCUS_entity_by_BN ||
                typeof windowFOCUS_entity_by_BN.FOCUS_resetVisibilityPredictions !== "function"
            ) {
                return;
            }

            windowFOCUS_entity_by_BN.FOCUS_resetVisibilityPredictions();
        }


        function RefreshLabelVisibility(ctx = CTX_GENTITY_si) {
            LABEL_refreshFixed(ctx);
        }


        function RefreshLinkVisibility(ctx = CTX_GENTITY_si) {
            const graph = ctxGraph(ctx);
            const visibleMap = {};

            graph.graphData().nodes.forEach(vertice => {
                visibleMap[vertice.id] = vertice.visible;
            });

            graph.graphData().links.forEach(link => {
                const sid = typeof link.source === "object" ? link.source.id : link.source;
                const tid = typeof link.target === "object" ? link.target.id : link.target;

                link.visible = visibleMap[sid] && visibleMap[tid];
            });
            graph.linkVisibility(link => link.visible);
        }


        function RefreshGraphDisplay(ctx = CTX_GENTITY_si) {
            RefreshNodeVisibility(ctx);      // nodes + picking + title counter
            RefreshLabelVisibility(ctx);     // labels only
            RefreshLinkVisibility(ctx);      // links only, exactly once
        }


        function RefreshEntityLabels(ctx = CTX_GENTITY_si) {
            RefreshLabelVisibility(ctx);     // label-only changes must not close SubGraphBN
        }


        function RefreshVisibility(ctx = CTX_GENTITY_si) {
            // Full synchronization after an Entity visibility state change.
            // This is the only refresh path allowed to close SubGraphBN.
            RefreshGraphDisplay(ctx);
            afterEntityVisibilityChanged(ctx);
        }


        // Visibility selection / projection builders.

        function ctxNeighbors_V_UNV(ctx, id) {
            const x = [[], []];
            const vertices = ctxVertices(ctx);
            const vertice = vertices[id];

            for (let i = 0; i < vertice.neighbors.length; i++) {
                const neighborId = vertice.neighbors[i];
                if (getVerticeVisible(ctx, neighborId)) {
                    x[0].push(neighborId);
                }
                else {
                    x[1].push(neighborId);
                }
            }
            return x;
        }


        function ctxCpEntityVertice_V_UNV(ctx, myid, scale) {
            let entity = [[], []];
            const vertices = ctxVertices(ctx);
            const ref = vertices[myid];

            if (!ref || !ref.group || !ref.group[scale]) {
                return entity;
            }

            for (let i = 0; i < vertices.length; i++) {
                const v = vertices[i];
                if (v.group && v.group[scale] && v.group[scale][0] == ref.group[scale][0]) {
                    if (getVerticeVisible(ctx, i)) {
                        entity[0].push(i);
                    }
                    else {
                        entity[1].push(i);
                    }
                }
            }
            return entity;
        }


        function EntitySelectionFromBasicNodes(selectionBasicNodes) {
            const selectionEntity = new Set();

            selectionBasicNodes.forEach(idBasicNode => {
                const ID = my_entity(idBasicNode);
                if (ID >= 0) {
                    selectionEntity.add(ID);
                }
            });

            return Array.from(selectionEntity);
        }


        function ApplyEntityVisibilitySelection(ctx, D) {
            if (SAFE_TRIGGER_BUSY_ENTITY_si) {
                return "BUSY";
            }

            const state = ctxState(ctx);
            const Builded = BuildVerticeSelection(ctx, D);

            if (Builded[0] !== "") {
                return false;
            }

            CommitVisibilitySelection_Once(ctx, D.ARO, Builded[1], D);

            return true;
        }


        function UPDATE_ENTITY_VISIBILITY_from_BasicNode(idBasicNode, kind, ARO) {
            const ctx = CTX_GENTITY_si;
            const state = ctxState(ctx);

            const T =
                (kind === "BASIC_NEIG")
                    ? "BASIC_NEIG"
                    : "BASIC_ME";

            const D = {
                T: T,
                ARO: ARO,
                ID: idBasicNode,
                s: state.s,
                a: "",
                b: ""
            };

            return ApplyEntityVisibilitySelection(ctx, D);
        }

        function FOCUS_entity_by_BN_visibilityPrediction(idBasicNode, kind, ARO) {
            if (SAFE_TRIGGER_BUSY_ENTITY_si) {
                return {
                    ok: "BUSY",
                    message: "Visualization not ready.",
                    text: ""
                };
            }

            const ctx = CTX_GENTITY_si;
            const state = ctxState(ctx);

            const T =
                (kind === "BASIC_NEIG")
                    ? "BASIC_NEIG"
                    : "BASIC_ME";

            const D = {
                T: T,
                ARO: ARO,
                ID: idBasicNode,
                s: state.s,
                a: "",
                b: ""
            };

            const built = BuildVerticeSelection(ctx, D);

            if (built[0] !== "") {
                return {
                    ok: false,
                    message: built[0],
                    text: ""
                };
            }

            return {
                ok: true,
                message: "",
                text: E_2_E_prediction(ctx, built[1], ARO),
                selectionEntity: built[1]
            };
        }


        function BuildBasicNodeSelectionFromProperties(D) {
            const T = D.T;
            const a = D.a;
            const b = D.b;

            const selectionBasic = [];

            if (!GBASE || !Array.isArray(GBASE.nodes)) {
                return ["GBASE.nodes missing", selectionBasic];
            }

            switch (T) {
                case "BASIC_DEG_RANGE": {
                    const aText = String(a || "").trim();
                    const bText = String(b || "").trim();

                    if (aText === "" && bText === "") {
                        return ["Invalid BasicNode degree range", selectionBasic];
                    }

                    const minDeg = (aText === "") ? 0 : Number(aText);
                    const maxDeg = (bText === "") ? Infinity : Number(bText);

                    if (
                        !Number.isInteger(minDeg) ||
                        !(Number.isInteger(maxDeg) || maxDeg === Infinity) ||
                        minDeg < 0 ||
                        maxDeg < 0 ||
                        minDeg > maxDeg
                    ) {
                        return ["Invalid BasicNode degree range", selectionBasic];
                    }

                    const degById = computeBasicNodeDegrees(GBASE);

                    GBASE.nodes.forEach(node => {
                        const deg = Number(degById.get(node.id) || 0);
                        if (minDeg <= deg && deg <= maxDeg) {
                            selectionBasic.push(node.id);
                        }
                    });

                    return ["", selectionBasic];
                }

                case "BASIC_LABEL_REGEX": {
                    try {
                        const regex = new RegExp(a, "u");

                        GBASE.nodes.forEach(node => {
                            const label = myIdLabelStringGBASE(node.id);
                            if (regex.test(label)) {
                                selectionBasic.push(node.id);
                            }
                        });

                        return ["", selectionBasic];
                    }
                    catch (e) {
                        return [e.message, selectionBasic];
                    }
                }

                default:
                    return ["Unknown BasicNode property selection: " + T, selectionBasic];
            }
        }


        function UPDATE_ENTITIES_VISIBILITY_from_BasicNodeProperties(D) {
            if (SAFE_TRIGGER_BUSY_ENTITY_si) {
                return {
                    ok: "BUSY",
                    message: "Visualization not ready.",
                    selectionBasic: [],
                    selectionEntity: []
                };
            }

            const ctx = CTX_GENTITY_si;
            const state = ctxState(ctx);

            const builtBasic = BuildBasicNodeSelectionFromProperties(D);
            if (builtBasic[0] !== "") {
                return {
                    ok: false,
                    message: builtBasic[0],
                    selectionBasic: builtBasic[1],
                    selectionEntity: []
                };
            }

            const selectionBasic = builtBasic[1];
            const selectionEntity = EntitySelectionFromBasicNodes(selectionBasic);

            const D_ENTITY = {
                T: "BASIC_PROPERTIES",
                ARO: D.ARO,
                ID: "",
                s: state.s,
                a: D.a,
                b: D.b,
                BasicSelectionType: D.T,
                selectionBasic: selectionBasic.slice(),
                selectionEntity: selectionEntity.slice()
            };

            CommitVisibilitySelection_Once(ctx, D_ENTITY.ARO, selectionEntity, D_ENTITY);

            return {
                ok: true,
                message:
                    "BasicNodes: " + selectionBasic.length +
                    " --> Entities: " + selectionEntity.length,
                selectionBasic: selectionBasic,
                selectionEntity: selectionEntity
            };
        }

        function FOCUS_entity_by_BN_propertiesPrediction(D) {
            if (SAFE_TRIGGER_BUSY_ENTITY_si) {
                return {
                    ok: "BUSY",
                    message: "Visualization not ready.",
                    text: ""
                };
            }

            const ctx = CTX_GENTITY_si;

            const builtBasic = BuildBasicNodeSelectionFromProperties(D);
            if (builtBasic[0] !== "") {
                return {
                    ok: false,
                    message: builtBasic[0],
                    selectionBasic: builtBasic[1],
                    selectionEntity: [],
                    text: ""
                };
            }

            const selectionBasic = builtBasic[1];
            const selectionEntity = EntitySelectionFromBasicNodes(selectionBasic);

            return {
                ok: true,
                message: "",
                selectionBasic: selectionBasic,
                selectionEntity: selectionEntity,
                text: E_2_E_prediction(ctx, selectionEntity, D.ARO)
            };
        }


        function BuildVerticeSelection(ctx, D) {
                const T = D.T; // "ME", "NEIG", "ENTITY", "DEG", "LAB"
            const ID = D.ID; // vertice id
            const s = D.s; // WHEN T="ENTITY" --> s is the index of scale description
            const a = D.a; // WHEN T="DEG" --> a is STRmin_deg, WHEN T="LAB" --> a is STRregex
            const b = D.b; // WHEN T="DEG" --> b is STRmax_deg
            const vertices = ctxVertices(ctx);

            let selection = [];
            switch (T) {
                case "ME": // This vertice
                    selection.push(ID);
                    return ["", selection];

                case "NEIG": // Its neighbors & itself
                    const myN = ctxNeighbors_V_UNV(ctx, ID);
                    selection = [].concat(myN[0], myN[1]); // neighbors
                    selection.push(ID); // itself
                    return ["", selection];

                case "ENTITY": // Current component/entity of this vertice
                    const myCpM = ctxCpEntityVertice_V_UNV(ctx, ID, s);
                    selection = [].concat(myCpM[0], myCpM[1]);
                    return ["", selection];

                case "BASIC_ME": // Entity containing this BasicNode
                    selection = EntitySelectionFromBasicNodes([ID]);
                    return ["", selection];

                case "BASIC_NEIG": // Entities containing this BasicNode neighbors & itself
                    selection = EntitySelectionFromBasicNodes(
                        BasicNodeNeighborsAndSelf(ID)
                    );
                    return ["", selection];

                case "BNC": { // BasicNodes covered by an ENTITY
                    const aText = String(a || "").trim();
                    const bText = String(b || "").trim();

                    if (aText === "" && bText === "") {
                        return ["Invalid Entity Size range", selection];
                    }

                    const minBNC = (aText === "") ? 0 : Number(aText);
                    const maxBNC = (bText === "") ? Infinity : Number(bText);

                    if (
                        !Number.isInteger(minBNC) ||
                        !(Number.isInteger(maxBNC) || maxBNC === Infinity) ||
                        minBNC < 0 ||
                        maxBNC < 0 ||
                        minBNC > maxBNC
                    ) {
                        return ["Invalid Entity Size range", selection];
                    }

                    for (let i = 0; i < vertices.length; i++) {
                        const bnc = Number(vertices[i].nb_Basic_Nodes_Covered || 0);
                        if ((minBNC <= bnc) && (bnc <= maxBNC)) {
                            selection.push(i);
                        }
                    }
                    return ["", selection];
                }

                case "DEG": { // degrees
                    const aText = String(a || "").trim();
                    const bText = String(b || "").trim();

                    if (aText === "" && bText === "") {
                        return ["Invalid Entity Degrees range", selection];
                    }

                    const min = (aText === "") ? 0 : Number(aText);
                    const max = (bText === "") ? Infinity : Number(bText);

                    if (
                        !Number.isInteger(min) ||
                        !(Number.isInteger(max) || max === Infinity) ||
                        min < 0 ||
                        max < 0 ||
                        min > max
                    ) {
                        return ["Invalid Entity Degrees range", selection];
                    }

                    for (let i = 0; i < vertices.length; i++) {
                        if ((min <= vertices[i].neighbors.length) && (vertices[i].neighbors.length <= max)) {
                            selection.push(i);
                        }
                    }
                    return ["", selection];
                }

                case "LAB": // labels

                    try {
                        const regex = new RegExp(a, "u");

                        for (let i = 0; i < vertices.length; i++) {
                            if (regex.test(vertices[i].name)) {
                                selection.push(i);
                            }
                        }
                        return ["", selection];

                    } catch (e) {
                        return [e.message, selection];
                    }
            }
            return ["", selection];
        }


        // Visibility commit / history / replay core.

        function makeVisibilityCommit(ARO, selectionEntity, meta = {}) {
            return {
                ARO: ARO,
                selectionEntity: selectionEntity.slice(),
                meta: meta
            };
        }


        function ApplyVisibilityMutation_Silent(ctx, ARO, selectionEntity, meta = {}) {
            const state = ctxState(ctx);
            const commit = makeVisibilityCommit(ARO, selectionEntity, meta);
            state.lback.push(commit);
            Update_ARO_selection_visible(ctx, ARO, selectionEntity);
        }


        function CommitVisibilitySelection_Once(ctx, ARO, selectionEntity, meta = {}) {
            ApplyVisibilityMutation_Silent(ctx, ARO, selectionEntity, meta);
            RefreshVisibility(ctx);
        }


        function MakeVisibilityOneBack(ctx) {
            // Rebuild Entity visibility from committed Entity selections only.
            const state = ctxState(ctx);
            const vertices = ctxVertices(ctx);

            if (state.lback.length < 1) {
                return;
            }

            // Replay sequence:
            state.lback.pop();

            // 1) remove the last committed visibility action;
            for (let id = 0; id < vertices.length; id++) {
                setVerticeVisible_Silent(ctx, id, true);
            }

            // 2) reset data state;
            state.lback.forEach(commit => {
                if (
                    !commit ||
                    !commit.ARO ||
                    !Array.isArray(commit.selectionEntity)
                ) {
                    return;
                }

                Update_ARO_selection_visible(
                    ctx,
                    commit.ARO,
                    commit.selectionEntity
                );
            });

            // 3) replay remaining commits without recomputing selections;
        // 4) update visuals once.
            RefreshVisibility(ctx);
        }


        function Update_ARO_selection_visible(ctx, ARO, selection) {
            const selectedSet = new Set(selection);
            const vertices = ctxVertices(ctx);

            switch (ARO) {
                case "ADD":
                    selection.forEach(id => {
                        setVerticeVisible_Silent(ctx, id, true);
                    });
                    break;

                case "REM":
                    selection.forEach(id => {
                        setVerticeVisible_Silent(ctx, id, false);
                    });
                    break;

                case "ONL":
                    vertices.forEach(vertice => {
                        setVerticeVisible_Silent(
                            ctx,
                            vertice.id,
                            vertice.visible && selectedSet.has(vertice.id)
                        );
                    });
                    break;

                default:
                    console.warn("Unknown visibility mode:", ARO);
                    return;
            }

            // Silent by design: no title or graph update here.
            // The unique visual synchronization is done by RefreshVisibility(ctx)
            // in CommitVisibilitySelection_Once().
        }

            return GBASE.nodes.map(node => {

        // BasicNode reference search engine shared by the mother FOCUS window
        // and the GBASIC child FOCUS popup.
        // Search key format: idGBASE:label.
        function BasicNodeReferenceNormalize(value) {
            return String(value || "").trim();
        }

        function BasicNodeReferenceExtractGbaseId(query) {
            const q = BasicNodeReferenceNormalize(query);
            if (q === "") return NaN;
            const match = q.match(/^\s*(\d+)/);
            return match ? Number(match[1]) : NaN;
        }

        function BasicNodeReferenceBuildItems(nodes, options = {}) {
            const idField = options.idField || "id";
            const labelField = options.labelField || "label";
            const internalIdField = options.internalIdField || idField;
            const labelAccessor =
                typeof options.labelAccessor === "function"
                    ? options.labelAccessor
                    : null;

            return (Array.isArray(nodes) ? nodes : []).map(node => {
                const rawId = node ? node[idField] : undefined;
                const id = Number(rawId);
                const label = String(
                    labelAccessor
                        ? labelAccessor(node)
                        : (node && node[labelField] !== undefined ? node[labelField] : "")
                );
                const displayId = Number.isFinite(id) ? id : rawId;
                const display = String(displayId + ":" + label);

                return {
                    id: id,
                    internalId: node ? node[internalIdField] : undefined,
                    label: label,
                    display: display,
                    node: node
                };
            });
        }

        function BasicNodeReferenceMatchesItem(item, queryLower) {
            return (
                String(item && item.display || "").toLowerCase().includes(queryLower) ||
                String(item && item.label || "").toLowerCase().includes(queryLower)
            );
        }

        function BasicNodeReferenceFindMatches(items, query) {
            const q = BasicNodeReferenceNormalize(query).toLowerCase();
            if (q === "") return [];

            return (Array.isArray(items) ? items : [])
                .filter(item => BasicNodeReferenceMatchesItem(item, q))
                .sort((a, b) => String(a.display).localeCompare(String(b.display)));
        }

        function BasicNodeReferenceFindByGbaseId(items, query) {
            const id = BasicNodeReferenceExtractGbaseId(query);
            if (!Number.isFinite(id)) return null;

            return (Array.isArray(items) ? items : [])
                .find(item => Number(item && item.id) === id) || null;
        }

        function BasicNodeReferenceFindExact(items, query) {
            const q = BasicNodeReferenceNormalize(query);
            if (q === "") return null;

            const data = Array.isArray(items) ? items : [];
            const qLower = q.toLowerCase();
            const id = BasicNodeReferenceExtractGbaseId(q);
            const prefix = q.split(":")[0].trim();

            if (Number.isFinite(id) && String(id) === prefix) {
                const byId = BasicNodeReferenceFindByGbaseId(data, q);
                if (byId) return byId;
            }

            return data.find(item => String(item.display || "").toLowerCase() === qLower) ||
                   data.find(item => String(item.label || "").toLowerCase() === qLower) ||
                   null;
        }

        function my_entity(id) {
            const basicNode = GBASE.nodes[id];
            if (!basicNode) return -1;

            const id_s = STATE_GENTITY_si.s;
            if (
                !basicNode.group ||
                !basicNode.group[id_s] ||
                basicNode.group[id_s][0] === undefined ||
                basicNode.group[id_s][0] === null
            ) {
                return -1;
            }

            const Id_Entity = basicNode.group[id_s][0];
            const Entity2Node =
                CTX_GENTITY_si.Entity2Node ||
                (CTX_GENTITY_si.Gjson ? CTX_GENTITY_si.Gjson.Entity2Node : null);

            if (!Entity2Node || typeof Entity2Node.get !== "function") {
                return -1;
            }

            const ID = Entity2Node.get(Id_Entity);

            return (ID === undefined || ID === null) ? -1 : ID;
        }

        function FOCUS_entity_by_BN_EntityLabel(ID) {
            if (ID < 0 || !GENTITY_si || !GENTITY_si.nodes || !GENTITY_si.nodes[ID]) {
                return "?";
            }

            return GENTITY_si.nodes[ID].name;
        }

        function FOCUS_entity_by_BN_EntityVisible(ID) {
            return (
                ID >= 0 &&
                GENTITY_si &&
                GENTITY_si.nodes &&
                GENTITY_si.nodes[ID] &&
                GENTITY_si.nodes[ID].visible !== false
            );
        }

            return id + ":" + myIdLabelStringGBASE(id);
        }

        function EntityDisplayLabelString(node) {
            if (!node) return "";

            const showVisibility = !!options.showVisibility;

            const label = FOCUS_entity_by_BN_BasicNodeLabel(id);

                const D = { T: "ME", ARO: "ADD", ID: ID, s: state.s, a: "", b: "" };
                const Builded = BuildVerticeSelection(ctx, D);

                D.ARO = "ADD";

            }

            CLick_node_L_00(null, GENTITY_si.nodes[ID]);
            return true;
        }

        function getBasicGraphNodeId(x) {
            return (x && typeof x === "object") ? x.id : x;
        }

        function BasicNodeNeighborsAndSelf(idBasicNode) {
            const selection = new Set();
            selection.add(idBasicNode);

            for (let i = 0; i < GBASE.links.length; i++) {
                const link = GBASE.links[i];
                const sourceId = getBasicGraphNodeId(link.source);
                const targetId = getBasicGraphNodeId(link.target);

                if (sourceId === idBasicNode) {
                    selection.add(targetId);
                }

                if (targetId === idBasicNode) {
                    selection.add(sourceId);
                }
            }

            return Array.from(selection);
        }
