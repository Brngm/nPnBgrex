        // KaTeX safe rendering helper.


        // Visibility from Entity.


        function updateVisibilityFromVertice(ctx, event, vertice) {
            event.preventDefault();
            event.stopPropagation();

            const clickedVerticeId = vertice.id;
            const vertices = ctxVertices(ctx);


            function E_1_E_prediction(selectionIds, ARO) {
                const selection = new Set(selectionIds);
                let visibleEntities = 0;
                let visibleBNC = 0;

                vertices.forEach(v => {
                    const id = v.id;
                    const isVisible = (v.visible !== false);
                    const selected = selection.has(id);

                    let futureVisible = isVisible;

                    if (ARO === "ADD") {
                        futureVisible = isVisible || selected;
                    }
                    else if (ARO === "REM") {
                        futureVisible = isVisible && !selected;
                    }
                    else if (ARO === "ONL") {
                        futureVisible = selected;
                    }

                    if (futureVisible) {
                        visibleEntities += 1;
                        visibleBNC += Number(v.nb_Basic_Nodes_Covered || 0);
                    }
                });

                return "⇒ Vis.E:" + visibleEntities + " →\nBNC:" + visibleBNC;
            }

            const neighbors = ctxNeighbors_V_UNV(ctx, clickedVerticeId);
            const selectionThisEntity = [clickedVerticeId];
            const selectionNeighborsAndItself = []
                .concat(neighbors[0], neighbors[1], [clickedVerticeId]);

            const VIS_MODE_E_1_E = {
                title: "VISIBILITY",
                subtitle: "(⊡) → [⊡]\n(This ENTITY) → [Visible ENTITIES]",
                choices: [
                    {
                        label: "This Entity",
                        detail: ctxIdLabelString(ctx, clickedVerticeId),
                        input: "no",
                        T: "ME",
                        selection: selectionThisEntity
                    },
                    {
                        label: "Its Neighbors & Itself",
                        input: "no",
                        T: "NEIG",
                        selection: selectionNeighborsAndItself
                    }
                ]
            };

            VIS_MODE_E_1_E.choices.forEach(choice => {
                choice.predictions = {
                    ADD: E_1_E_prediction(choice.selection, "ADD"),
                    REM: E_1_E_prediction(choice.selection, "REM"),
                    ONL: E_1_E_prediction(choice.selection, "ONL")
                };
            });

            const menu = document.getElementById("menuVizFromNode");
            if (!menu) return;

            closeContextPopups("menuVizFromNode");

            menu.innerHTML = "";

            const h1 = document.createElement("h2");
            setVisibilityTitlePlain(h1, [VIS_MODE_E_1_E.title]);
            h1.style.textAlign = "center";
            h1.style.color = "#ffffff";
            h1.style.background = "#000000";
            h1.style.padding = "6px";
            h1.style.margin = "0 0 6px 0";
            menu.appendChild(h1);

            const h2 = document.createElement("h2");
            setVisibilityTitlePlain(h2, [VIS_MODE_E_1_E.subtitle], "subtitle");
            menu.appendChild(h2);

            VIS_MODE_E_1_E.choices.forEach(choice => {
                const block = document.createElement("div");
                block.className = "action-blocVizFromNode";

                const h3 = document.createElement("h3");
                h3.textContent = choice.label;
                block.appendChild(h3);

                if (choice.detail) {
                    const detail = document.createElement("div");
                    detail.className = "VIS_choiceDetail";
                    detail.textContent = choice.detail;
                    block.appendChild(detail);
                }

                const row = document.createElement("div");
                row.className = "btn-desc-rowVizFromNode";

                ["ADD", "REM", "ONL"].forEach(actionName => {
                    const item = document.createElement("div");
                    item.className = "btn-desc-itemVizFromNode";

                    const btn = document.createElement("div");
                    btn.className = "ctx-btnVizFromNode";
                    btn.textContent = actionName;
                    btn.onclick = () => {
                        const state = ctxState(ctx);
                        const D = {
                            T: choice.T,
                            ARO: actionName,
                            ID: clickedVerticeId,
                            s: state.s,
                            a: "",
                            b: ""
                        };

                        const Builded = BuildVerticeSelection(ctx, D);

                        if (Builded[0] === "") {
                            CommitVisibilitySelection_Once(ctx, D.ARO, Builded[1], D);
                            menu.style.display = "none";
                        }
                    };

                    const desc = document.createElement("div");
                    desc.className = "desc-textVizFromNode";
                    desc.textContent = choice.predictions[actionName];

                    item.appendChild(btn);
                    item.appendChild(desc);
                    row.appendChild(item);
                });

                block.appendChild(row);
                menu.appendChild(block);
            });

            // Open the mother context popup at the clicked Entity position.
            placePopupBottomLeftOnNode(menu, vertice);
        };


        // VIS.E.2.E — Entity properties to Entity visibility.


        function E_2_E_prediction(ctx, selectionIds, ARO) {
            const vertices = ctxVertices(ctx);
            const selection = new Set(selectionIds || []);
            let visibleEntities = 0;
            let visibleBNC = 0;

            vertices.forEach(v => {
                const id = v.id;
                const isVisible = (v.visible !== false);
                const selected = selection.has(id);

                let futureVisible = isVisible;

                if (ARO === "ADD") {
                    futureVisible = isVisible || selected;
                }
                else if (ARO === "REM") {
                    futureVisible = isVisible && !selected;
                }
                else if (ARO === "ONL") {
                    futureVisible = selected;
                }

                if (futureVisible) {
                    visibleEntities += 1;
                    visibleBNC += Number(v.nb_Basic_Nodes_Covered || 0);
                }
            });

            return "⇒ Vis.E:" + visibleEntities + " →\nBNC:" + visibleBNC;
        }

        function VIS_clearErrorCOM(errorCom) {
            if (errorCom) errorCom.textContent = "";
        }

        function VIS_setErrorCOM(errorCom, message) {
            if (errorCom) errorCom.textContent = String(message || "");
        }

        function E_2_E_makeButton(parent, ctx, menu, choice, actionName, getD, desc, errorCom) {
            const btn = document.createElement("div");
            btn.className = "ctx-btnVizFromNode";
            btn.textContent = actionName;
            btn.onclick = () => {
                const state = ctxState(ctx);
                const D = getD(actionName);
                const Builded = BuildVerticeSelection(ctx, D);

                if (Builded[0] === "") {
                    CommitVisibilitySelection_Once(ctx, D.ARO, Builded[1], D);
                    menu.style.display = "none";
                }
                else {
                    desc.textContent = "";
                    VIS_setErrorCOM(errorCom, Builded[0]);
                }
            };
            parent.appendChild(btn);
            return btn;
        }

        function E_2_E_updatePrediction(ctx, choice, actionName, getD, desc, errorCom) {
            const D = getD(actionName);
            const Builded = BuildVerticeSelection(ctx, D);

            if (Builded[0] === "") {
                VIS_clearErrorCOM(errorCom);
                desc.textContent = E_2_E_prediction(ctx, Builded[1], actionName);
            }
            else {
                desc.textContent = "";
                VIS_setErrorCOM(errorCom, Builded[0]);
            }
        }

        function E_2_E_addChoiceBlock(ctx, menu, choice) {
            const block = document.createElement("div");
            block.className = "action-blocVizFromNode";

            const h3 = document.createElement("h3");
            h3.textContent = choice.label;
            block.appendChild(h3);

            let getD = null;
            let inputs = [];

            if (choice.input === "min,max") {
                const inputRow = document.createElement("div");
                inputRow.style.display = "flex";
                inputRow.style.alignItems = "center";
                inputRow.style.gap = "10px";

                const inputMin = document.createElement("input");
                inputMin.type = "number";
                inputMin.placeholder = "min";
                inputMin.style.width = "90px";
                inputMin.addEventListener("mousedown", ev => ev.stopPropagation());

                const inputMax = document.createElement("input");
                inputMax.type = "number";
                inputMax.placeholder = "max";
                inputMax.style.width = "90px";
                inputMax.addEventListener("mousedown", ev => ev.stopPropagation());

                const mid = document.createElement("span");
                mid.textContent = "≤ " + choice.short + " ≤";

                inputRow.appendChild(inputMin);
                inputRow.appendChild(mid);
                inputRow.appendChild(inputMax);
                block.appendChild(inputRow);

                inputs = [inputMin, inputMax];

                getD = (ARO) => {
                    let min = inputMin.value;
                    let max = inputMax.value;
                    if (min === "") { min = 0; }
                    if (max === "") { max = Number.MAX_SAFE_INTEGER; }
                    return { T: choice.T, ARO: ARO, ID: "", s: "", a: "" + min, b: "" + max };
                };
            }

            if (choice.input === "string") {
                const inputRow = document.createElement("div");
                inputRow.style.display = "flex";
                inputRow.style.alignItems = "center";
                inputRow.style.gap = "10px";

                const inputRegex = document.createElement("input");
                inputRegex.type = "text";
                inputRegex.placeholder = "regex";
                inputRegex.style.width = "420px";
                inputRegex.style.maxWidth = "100%";
                inputRegex.addEventListener("mousedown", ev => ev.stopPropagation());

                inputRow.appendChild(inputRegex);
                block.appendChild(inputRow);

                const examples = [
                    "Equal to 'forêt': ^forêt$",
                    "Starting with 'forest': ^forest",
                    "Containing '森林': 森林",
                    "Ending with 'जंगल': जंगल$",
                    "Not containing 'bosque': ^(?!.*bosque).*$"
                ];
                examples.forEach(ex => {
                    const line = document.createElement("span");
                    line.style.marginLeft = "20px";
                    line.style.fontSize = "14px";
                    line.style.display = "block";
                    line.textContent = ex;
                    block.appendChild(line);
                });

                inputs = [inputRegex];

                getD = (ARO) => {
                    return { T: choice.T, ARO: ARO, ID: "", s: "", a: inputRegex.value, b: "" };
                };
            }

            const errorCom = document.createElement("div");
            errorCom.className = "VIS_errorCOM VIS_COM_REGEX";

            const row = document.createElement("div");
            row.className = "btn-desc-rowVizFromNode";

            const descs = [];

            ["ADD", "REM", "ONL"].forEach(actionName => {
                const item = document.createElement("div");
                item.className = "btn-desc-itemVizFromNode";

                const desc = document.createElement("div");
                desc.className = "desc-textVizFromNode";

                E_2_E_makeButton(item, ctx, menu, choice, actionName, getD, desc, errorCom);
                item.appendChild(desc);
                row.appendChild(item);
                descs.push({ actionName: actionName, desc: desc });
            });

            block.appendChild(row);

            block.appendChild(errorCom);

            menu.appendChild(block);

            const refreshPredictions = () => {
                descs.forEach(x => E_2_E_updatePrediction(ctx, choice, x.actionName, getD, x.desc, errorCom));
            };

            if (choice.input !== "string") {
                inputs.forEach(input => input.addEventListener("input", refreshPredictions));
                refreshPredictions();
            }
            else {
                const LABEL_PREDICTION_ENTITY_LIMIT = 100000;
                const LABEL_PREDICTION_DEBOUNCE_MS = 400;
                let labelPredictionTimer = null;

                const refreshLabelPredictions_Delayed = () => {
                    if (labelPredictionTimer) {
                        clearTimeout(labelPredictionTimer);
                    }

                    labelPredictionTimer = setTimeout(() => {
                        const vertices = ctxVertices(ctx);
                        const regexText = String(inputs[0].value || "").trim();

                        descs.forEach(x => { x.desc.textContent = ""; });
                        VIS_clearErrorCOM(errorCom);

                        if (regexText === "") {
                            return;
                        }

                        if (vertices.length > LABEL_PREDICTION_ENTITY_LIMIT) {
                            VIS_setErrorCOM(
                                errorCom,
                                "Label prediction disabled for large graph"
                            );
                            return;
                        }

                        refreshPredictions();
                    }, LABEL_PREDICTION_DEBOUNCE_MS);
                };

                inputs.forEach(input => input.addEventListener("input", refreshLabelPredictions_Delayed));
            }
        }

        function open_E_2_E(event, ctx = CTX_GENTITY_si) {
            event.preventDefault();
            event.stopPropagation();

            const menu = document.getElementById("menuLDCON");
            if (!menu) return;

            closeContextPopups("menuLDCON");
            menu.innerHTML = "";

            const model = {
                title: "VISIBILITY",
                subtitle: "(⊡⊡⊡) → [⊡]\n(ENTITY Properties) → [Visible ENTITIES]",
                choices: [
                    { label: "Entity Size", input: "min,max", short: "Size", T: "BNC" },
                    { label: "Entity Degrees", input: "min,max", short: "Deg", T: "DEG" },
                    { label: "Entity Labels", input: "string", T: "LAB" }
                ]
            };

            const h1 = document.createElement("h2");
            setVisibilityTitlePlain(h1, [model.title]);
            h1.style.textAlign = "center";
            h1.style.color = "#ffffff";
            h1.style.background = "#000000";
            h1.style.padding = "6px";
            h1.style.margin = "0 0 6px 0";
            menu.appendChild(h1);

            const h2 = document.createElement("h2");
            setVisibilityTitlePlain(h2, [model.subtitle], "subtitle");
            menu.appendChild(h2);

            const state = ctxState(ctx);
            const backBtn = document.createElement("button");
            let nbBACK = state.lback.length;
            backBtn.textContent = "← BACK [" + nbBACK + "]";
            backBtn.style.display = "block";
            backBtn.style.cursor = "pointer";
            backBtn.style.padding = "6px 12px";
            backBtn.style.background = "#757575";
            backBtn.style.color = "white";
            backBtn.style.border = "none";
            backBtn.style.fontWeight = "bold";
            backBtn.style.margin = "10px auto";
            backBtn.onmouseenter = () => backBtn.style.background = "#4F4F4F";
            backBtn.onmouseleave = () => backBtn.style.background = "#757575";
            backBtn.addEventListener("click", ev => {
                ev.preventDefault();
                ev.stopPropagation();

                if (state.lback.length > 0) {
                    MakeVisibilityOneBack(ctx);
                    menu.style.display = "none";
                }
            });
            menu.appendChild(backBtn);

            model.choices.forEach(choice => E_2_E_addChoiceBlock(ctx, menu, choice));

            const menuWidth = parseFloat(getComputedStyle(menu).width) || 460;
            menu.style.left = Math.max(0, event.clientX - menuWidth + 70) + "px";
            menu.style.top = event.clientY + "px";
            menu.style.display = "block";
            // Opening the E_2_E popup does not mutate graph visibility.
            // Keep this path UI-only to avoid freezing mouse/browser on right-click.
        }


        function onBackgroundRightClick(event) {
            open_E_2_E(event, CTX_GENTITY_si);
        }


        ;


    </script>
